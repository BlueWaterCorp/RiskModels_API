[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riskmodels-render-svc"
version = "0.1.0"
description = "Cloud Run render service — re-renders canonical-snapshot artifacts (P1, F1, C1) from GCS-stored canonical JSON on demand."
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
authors = [{ name = "RiskModels" }]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "google-cloud-storage>=2.14,<3",
  # GCS-backed per-fund zarrs: ``riskmodels.snapshots._fund_data`` opens
  # ``gs://...`` with gcsfs + zarr (not pulled in by the PyPI SDK extras today).
  "gcsfs>=2023.6.0",
  "pydantic>=2.6,<3",
  "zarr>=2.18,<3",
  # Portfolio-evolution kernel + /healthz ERM3 probe (see portfolio_evolution.py).
  "xarray>=2024.1",
  # Public SDK with F1 canonical schema + reference renderers.
  # Local uv resolves via [tool.uv.sources] → ../../sdk (editable).
  # Container build copies in-tree sdk/ (see Dockerfile) — not this lock pin.
  # Keep the floor at the published filer-surface release (as_of, concentration).
  "riskmodels-py>=0.3.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "httpx>=0.27,<1",
  "pytest-asyncio>=0.23,<1",
]

# Prefer the sibling editable SDK over a stale PyPI wheel (uv.lock previously
# pinned 0.3.10 while source/__version__ were already 0.3.11 — pytest then
# imported the older site-packages copy and silently skipped filer coverage).
[tool.uv.sources]
riskmodels-py = { path = "../../sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep render_svc importable without relying on an ambient PYTHONPATH that
# might also inject a second riskmodels tree ahead of the editable install.
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["render_svc"]
