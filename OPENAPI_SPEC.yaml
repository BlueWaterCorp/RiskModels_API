    MCPTool:
      type: object
      description: >
        MCP tool descriptor as returned by `tools/list`. Tools are discoverable via
        `https://riskmodels.app/.well-known/mcp.json` or by connecting to the SSE
        endpoint at `https://riskmodels.app/api/mcp/sse` and calling `tools/list`.
      properties:
        name:
          type: string
          enum:
            - riskmodels_list_endpoints
            - riskmodels_get_capability
            - riskmodels_get_schema
            - riskmodels_decompose
            - riskmodels_compare
            - riskmodels_get_hedge_levels
            - riskmodels_analyze_portfolio
            - riskmodels_hedge_portfolio
            - get_l3_decomposition
            - get_metrics
            - get_portfolio_risk_snapshot
            - post_snapshot
          description: |
            Representative MCP tool names for this deployment (hosted Streamable HTTP and stdio share the RiskModels subset;
            hosted adds live REST-backed tools).

            Stdio/SDK-oriented tools (`registerRiskModelsTools`):
            - `riskmodels_decompose` — POST /decompose: L3 four-layer `exposure` + `hedge` map. For comparing L1/L2/L3
              standalone solutions, prefer `riskmodels_get_hedge_levels` or read `hedge_levels` when present on decompose metrics.
            - `riskmodels_get_hedge_levels` — GET /metrics/{ticker} narrowed to the canonical `hedge_levels` block.
            - `riskmodels_compare` / `riskmodels_analyze_portfolio` — POST /batch/analyze for multiple tickers; portfolio path
              renormalizes weights and surfaces aggregated `portfolio_hedge_levels` in the MCP wrapper output.
            - `riskmodels_hedge_portfolio` — Uses batch `/batch/analyze` per-ticker `hedge_levels` at the chosen cascade level and
              scales to `notional_usd` positions (sums hedge notionals across ETFs).
            - `riskmodels_list_endpoints` / `riskmodels_get_capability` / `riskmodels_get_schema` — discovery.

            Hosted-only tools (`mcp/src/server.ts`):
            - `get_l3_decomposition`, `get_metrics`, `get_portfolio_risk_snapshot`, `post_snapshot` — proxied REST with billing headers surfaced in the MCP JSON envelope.
        description:
          type: string
        inputSchema:
          type: object
          description: JSON Schema describing the tool's input parameters.
        outputSchema:
          type: object
          description: JSON Schema describing the tool's output structure.

    RankingMetricKeys:
      type: object
      description: >
        V3 security_history ranking metric keys (when rankings are exposed via API).
        Pattern: rank_ord_{window}_{cohort}_{metric}, cohort_size_{window}_{cohort}_{metric}.
        Windows: 1d, 21d, 63d, 252d. Cohorts: universe, sector, subsector.
        Metrics: mkt_cap, gross_return, sector_residual, subsector_residual, er_l1, er_l2, er_l3.
        rank_percentile computed client-side: (1 - (rank_ord - 1) / cohort_size) * 100.

    InsufficientBalance:
      type: object
      description: Returned when the account prepaid balance is exhausted (HTTP 402).
      properties:
        error:
          type: string
          enum: [INSUFFICIENT_BALANCE]
          example: INSUFFICIENT_BALANCE
        message:
          type: string
          example: "Insufficient balance. Current balance: $0.00. Top up at https://riskmodels.app/billing"
        balance_usd:
          type: number
          format: float
          example: 0.0
        top_up_url:
          type: string
          format: uri
          example: https://riskmodels.app/billing

    RateLimitExceeded:
      type: object
      description: Returned when the per-minute rate limit is exceeded (HTTP 429).
      properties:
        error:
          type: string
          enum: [RATE_LIMIT_EXCEEDED]
          example: RATE_LIMIT_EXCEEDED
        message:
          type: string
          example: "Rate limit exceeded. Retry after 2026-03-08T12:34:56Z"
        retry_after:
          type: string
          format: date-time
          description: ISO timestamp after which the client may retry.
          example: "2026-03-08T12:34:56Z"
        limit:
          type: integer
          description: Requests allowed per minute for this key.
          example: 60

    Fund:
      type: object
      description: >
        Mutual fund registry row from `public.funds`. One row per `bw_fund_id`.
        Latest temporal triple (`latest_report_date` / `latest_filing_date` /
        `latest_extracted_at`) reflects the most recent N-PORT snapshot known
        for this fund. Q5 lock: `primary_bw_fund_id` is reserved as a nullable
        column; NULL means this row IS the primary share class (or no primary
        chosen yet). See ARCHITECTURE_FUNDS_API.md §4.1.
      properties:
        bw_fund_id:
          type: string
          description: Funds_DAG canonical fund id. Format `BW-FUND-{series_id}`.
          example: BW-FUND-S000004310
        series_id:
          type: string
          nullable: true
          description: SEC series id.
          example: S000004310
        ticker:
          type: string
          nullable: true
          example: VFINX
        cik:
          type: string
          nullable: true
        fund_name:
          type: string
          nullable: true
          example: Vanguard 500 Index Fund Investor Shares
        morningstar_category:
          type: string
          nullable: true
        equity_style_9box:
          type: string
          nullable: true
          enum:
            - Large Value
            - Large Blend
            - Large Growth
            - Mid Value
            - Mid Blend
            - Mid Growth
            - Small Value
            - Small Blend
            - Small Growth
        style_link_method:
          type: string
          nullable: true
        primary_bw_fund_id:
          type: string
          nullable: true
        latest_report_date:
          type: string
          format: date
          nullable: true
          description: Period end of the most recent reported holdings (= "fund_date").
        latest_filing_date:
          type: string
          format: date
          nullable: true
          description: SEC acceptance date for the latest filing (= "release_date").
        latest_extracted_at:
          type: string
          format: date-time
          nullable: true
        latest_total_adj_mv:
          type: number
          format: float
          nullable: true
        latest_n_holdings:
          type: integer
          nullable: true
        latest_effective_n:
          type: number
          format: float
          nullable: true
        last_in_eligible_universe_at:
          type: string
          format: date
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true

    FundLatest:
      type: object
      description: >
        Wide-row latest knowledge-mode snapshot from `public.funds_latest`.
        One row per `bw_fund_id`. Returns and diagnostics flatten the per-fund
        `ds_portfolio.zarr` (Funds_DAG Slice 8). Multi-quarter history lives
        in GCS Zarr (Stage B+). See ARCHITECTURE_FUNDS_API.md §4.2.
      required: [bw_fund_id, report_date, filing_date, extracted_at, last_synced_at]
      properties:
        bw_fund_id: { type: string, example: BW-FUND-S000004310 }
        report_date: { type: string, format: date, example: "2026-04-30" }
        filing_date: { type: string, format: date, example: "2026-07-14" }
        extracted_at: { type: string, format: date-time }
        portfolio_gross_return: { type: number, format: float, nullable: true }
        portfolio_market_return: { type: number, format: float, nullable: true }
        portfolio_sector_return: { type: number, format: float, nullable: true }
        portfolio_subsector_return: { type: number, format: float, nullable: true }
        portfolio_idiosyncratic_return: { type: number, format: float, nullable: true }
        identity_residual: { type: number, format: float, nullable: true }
        weight_sum:
          type: number
          format: float
          nullable: true
          description: ERM3 universe coverage (fraction of fund AUM mapping to in-universe symbols).
        n_holdings_active: { type: integer, nullable: true }
        effective_n:
          type: number
          format: float
          nullable: true
          description: HHI-derived diversification (1 / sum(w_i^2)).
        top10_weight_sum: { type: number, format: float, nullable: true }
        total_adj_mv: { type: number, format: float, nullable: true }
        equity_style_9box: { type: string, nullable: true }
        n_funds_in_cell_at_report_date: { type: integer, nullable: true }
        model_version:
          type: string
          nullable: true
          example: funds_dag.v20260502
        factor_set_id:
          type: string
          nullable: true
          example: uni_mc_3000_SPY
        last_synced_at: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true
          nullable: true

    FundWithLatest:
      type: object
      description: Fund registry row joined with the latest knowledge-mode snapshot.
      required: [fund]
      properties:
        fund:
          $ref: "#/components/schemas/Fund"
        latest:
          oneOf:
            - $ref: "#/components/schemas/FundLatest"
            - type: "null"
          nullable: true

    FundsBatchRequest:
      type: object
      required: [fund_ids]
      properties:
        fund_ids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 1000
          example: ["BW-FUND-S000004310", "BW-FUND-S000123456"]

    FundsBatchResponse:
      type: object
      description: Multi-fund lookup. Keys are `bw_fund_id`s present in the registry.
      properties:
        results:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FundWithLatest"

    FundsSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Fund"

    FundsStyleMembersResponse:
      type: object
      required: [equity_style_9box, slug, fund_ids, count]
      properties:
        equity_style_9box:
          type: string
          example: Large Blend
        slug:
          type: string
          example: large-blend
        fund_ids:
          type: array
          items:
            type: string
        count:
          type: integer

    FundCohortRankEntry:
      type: object
      description: >
        One ranking row for a fund within its 9-box cell. The "n of n_group"
        view: this fund placed `rank` out of `cohort_size` peers on this
        `metric` over `period_window`.
      required: [metric, period_window, rank]
      properties:
        metric: { type: string, example: portfolio_gross_return }
        period_window: { type: string, enum: ["1m", "3m", "12m", "36m"] }
        rank: { type: integer, example: 5 }
        cohort_size: { type: integer, nullable: true, example: 540 }
        value: { type: number, format: float, nullable: true }

    FundSnapshotResponse:
      type: object
      description: >
        Composed JSON snapshot for a single mutual fund. Bundles registry +
        latest metrics + top-25 holdings + L1/L2/L3 hedge + 12-month
        portfolio time series + cohort context (rank-within-cell on every
        metric the rankings table covers).
      required: [bw_fund_id, report_date, filing_date, metrics, portfolio_history, _metadata]
      properties:
        bw_fund_id: { type: string }
        ticker: { type: string, nullable: true }
        fund_name: { type: string, nullable: true }
        equity_style_9box: { type: string, nullable: true }
        report_date: { type: string, format: date }
        filing_date: { type: string, format: date }
        metrics: { $ref: "#/components/schemas/FundMetricsResponse" }
        holdings:
          type: object
          nullable: true
          properties:
            n_total_holdings: { type: integer }
            n_returned: { type: integer }
            top:
              type: array
              items: { $ref: "#/components/schemas/FundHolding" }
        hedge:
          oneOf:
            - $ref: "#/components/schemas/FundHedgeResponse"
            - type: "null"
          nullable: true
        portfolio_history:
          type: object
          required: [lookback_months, n_periods, rows]
          properties:
            lookback_months: { type: integer, example: 12 }
            n_periods: { type: integer }
            rows:
              type: array
              items: { $ref: "#/components/schemas/FundPortfolioRow" }
        nav_history:
          type: object
          nullable: true
          description: >
            Trailing 12-month yfinance NAV history. `null` when the fund has
            no yfinance-resolvable ticker (~35% of the universe — institutional
            SMAs, separately-managed accounts, mutual funds without retail
            tickers). Pair with `portfolio_history` on the same teos to surface
            the gap between 13F-derived attribution and realised NAV (intra-quarter
            trading, fees, cash drag).
          required: [lookback_months, n_periods, rows]
          properties:
            lookback_months: { type: integer, example: 12 }
            n_periods: { type: integer }
            rows:
              type: array
              items: { $ref: "#/components/schemas/FundNavRow" }
        cohort_context:
          type: object
          nullable: true
          properties:
            equity_style_9box: { type: string, nullable: true }
            n_funds_in_cell: { type: integer, nullable: true }
            ranks:
              type: array
              items: { $ref: "#/components/schemas/FundCohortRankEntry" }
        _metadata:
          type: object
          properties:
            model_version: { type: string, nullable: true }
            factor_set_id: { type: string, nullable: true }
            data_as_of: { type: string, format: date }
            data_freshness: { type: string, format: date-time }

    CohortRankEntry:
      type: object
      description: One ranked entity inside a top_funds / top_symbols block.
      required: [rank, entity_id]
      properties:
        rank: { type: integer }
        entity_id: { type: string }
        value: { type: number, format: float, nullable: true }
        cohort_size: { type: integer, nullable: true }

    CohortRankBlock:
      type: object
      description: A ranked list scoped to one (metric, period_window, weighting) tuple.
      required: [metric, period_window, weighting, rows]
      properties:
        metric: { type: string }
        period_window: { type: string, enum: ["1m", "3m", "12m", "36m"] }
        weighting: { type: string, enum: [ew, mv] }
        rows:
          type: array
          items: { $ref: "#/components/schemas/CohortRankEntry" }

    CohortSnapshotResponse:
      type: object
      description: >
        Composed JSON snapshot for a 9-box style cell — the differentiated
        wedge surface. Bundles cohort metrics (EW + MV), top-25 cohort
        holdings, 12-month cohort portfolio history, top-10 funds in cell,
        and top-15 symbols in cell.
      required: [equity_style_9box, slug, report_date, metrics, portfolio_history, _metadata]
      properties:
        equity_style_9box: { type: string }
        slug: { type: string }
        report_date: { type: string, format: date }
        filing_date_max: { type: string, format: date, nullable: true }
        n_funds_in_cell: { type: integer, nullable: true }
        metrics:
          type: object
          properties:
            weightings:
              type: object
              properties:
                ew: { $ref: "#/components/schemas/StyleCohortReturnsBlock" }
                mv: { $ref: "#/components/schemas/StyleCohortReturnsBlock" }
        holdings:
          type: object
          nullable: true
          properties:
            weighting: { type: string, enum: [ew, mv] }
            n_total_holdings: { type: integer }
            n_returned: { type: integer }
            top:
              type: array
              items: { $ref: "#/components/schemas/CohortHolding" }
        portfolio_history:
          type: object
          required: [lookback_months, n_periods, rows]
          properties:
            lookback_months: { type: integer, example: 12 }
            n_periods: { type: integer }
            rows:
              type: array
              items: { $ref: "#/components/schemas/CohortPortfolioRow" }
        top_funds:
          oneOf:
            - $ref: "#/components/schemas/CohortRankBlock"
            - type: "null"
          nullable: true
        top_symbols:
          oneOf:
            - $ref: "#/components/schemas/CohortRankBlock"
            - type: "null"
          nullable: true
        _metadata:
          type: object
          properties:
            model_version: { type: string, nullable: true }
            data_as_of: { type: string, format: date }
            data_freshness: { type: string, format: date-time }

    CohortPortfolioRow:
      type: object
      description: One teo of a cohort portfolio time series. Both EW + MV blocks side-by-side.
      required: [teo]
      properties:
        teo: { type: string, format: date, example: "2026-04-30" }
        ew: { $ref: "#/components/schemas/StyleCohortReturnsBlock" }
        mv: { $ref: "#/components/schemas/StyleCohortReturnsBlock" }

    CohortPortfolioHistoryResponse:
      type: object
      description: >
        Per-cell cohort portfolio time series from Slice 6's per-cell
        ds_portfolio.zarr. Each row carries both EW and MV blocks.
      required: [equity_style_9box, slug, n_periods, start_teo, end_teo, rows]
      properties:
        equity_style_9box: { type: string }
        slug: { type: string }
        n_periods: { type: integer }
        start_teo: { type: string, format: date }
        end_teo: { type: string, format: date }
        rows:
          type: array
          items: { $ref: "#/components/schemas/CohortPortfolioRow" }

    CohortHolding:
      type: object
      description: One cohort-aggregated holding within a 9-box cell.
      required: [bw_sym_id, weight]
      properties:
        bw_sym_id:
          type: string
          description: Internal symbol id. Resolve via /api/data/symbols/batch.
        weight:
          type: number
          format: float
          description: Cohort weight at this teo (sums to 1.0 within the chosen weighting).
        contribution_gross: { type: number, format: float, nullable: true }
        contribution_market: { type: number, format: float, nullable: true }
        contribution_sector: { type: number, format: float, nullable: true }
        contribution_subsector: { type: number, format: float, nullable: true }
        contribution_idiosyncratic: { type: number, format: float, nullable: true }
        n_funds_holding:
          type: integer
          nullable: true
          description: Number of funds in the cell holding this symbol.

    CohortHoldingsResponse:
      type: object
      description: Top-N cohort holdings at the latest teo for the chosen weighting.
      required: [equity_style_9box, slug, teo, weighting, n_returned, n_total_holdings, holdings]
      properties:
        equity_style_9box: { type: string }
        slug: { type: string }
        teo: { type: string, format: date }
        weighting: { type: string, enum: [ew, mv] }
        n_returned: { type: integer }
        n_total_holdings: { type: integer }
        holdings:
          type: array
          items: { $ref: "#/components/schemas/CohortHolding" }

    StyleCohortReturnsBlock:
      type: object
      description: Portfolio return components + diagnostics for one weighting in a cohort.
      properties:
        portfolio_gross_return: { type: number, format: float, nullable: true }
        portfolio_market_return: { type: number, format: float, nullable: true }
        portfolio_sector_return: { type: number, format: float, nullable: true }
        portfolio_subsector_return: { type: number, format: float, nullable: true }
        portfolio_idiosyncratic_return: { type: number, format: float, nullable: true }
        identity_residual: { type: number, format: float, nullable: true }
        weight_sum:
          type: number
          format: float
          nullable: true
          description: Cohort coverage (fraction of cohort AUM in mapped symbols).
        n_holdings_active: { type: integer, nullable: true }
        effective_n: { type: number, format: float, nullable: true }
        top10_weight_sum: { type: number, format: float, nullable: true }

    StyleCohortMetricsResponse:
      type: object
      description: >
        Latest cohort metrics for a 9-box style cell. Both equal-weight (EW)
        and market-value-weighted (MV) cohort portfolios are returned
        side-by-side under `weightings`. Bitemporal lineage at top level.
      required: [equity_style_9box, slug, report_date, weightings, _metadata]
      properties:
        equity_style_9box:
          type: string
          example: Large Blend
        slug:
          type: string
          example: large-blend
        report_date: { type: string, format: date }
        filing_date_max: { type: string, format: date, nullable: true }
        n_funds_in_cell: { type: integer, nullable: true }
        weightings:
          type: object
          properties:
            ew: { $ref: "#/components/schemas/StyleCohortReturnsBlock" }
            mv: { $ref: "#/components/schemas/StyleCohortReturnsBlock" }
        _metadata:
          type: object
          properties:
            model_version: { type: string, nullable: true }
            data_as_of: { type: string, format: date }
            data_freshness: { type: string, format: date-time }
            last_synced_at: { type: string, format: date-time }

    StyleCohortRankingRow:
      type: object
      required: [rank, entity_id]
      properties:
        rank: { type: integer, example: 1 }
        entity_id:
          type: string
          description: bw_sym_id (cohort=symbol), sector code (cohort=sector), or bw_fund_id (cohort=fund).
        value: { type: number, format: float, nullable: true }
        cohort_size: { type: integer, nullable: true }

    StyleCohortRankingsResponse:
      type: object
      required: [equity_style_9box, slug, cohort_type, metric, period_window, weighting, report_date, n_returned, rows]
      properties:
        equity_style_9box: { type: string }
        slug: { type: string }
        cohort_type:
          type: string
          enum: [symbol, sector, fund]
        metric: { type: string }
        period_window:
          type: string
          enum: ["1m", "3m", "12m", "36m"]
        weighting:
          type: string
          enum: [ew, mv]
        report_date: { type: string, format: date }
        filing_date_max: { type: string, format: date, nullable: true }
        n_returned: { type: integer }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/StyleCohortRankingRow"

    FundHedgeLeg:
      type: object
      description: One ETF hedge leg at a given factor level.
      required: [etf, hr]
      properties:
        etf:
          type: string
          description: ETF symbol (e.g. SPY, XLK, SMH).
        hr:
          type: number
          format: float
          description: Hedge ratio (dollar_ratio) — ETF notional per $1 of fund exposure at this level.

    FundHedgeResponse:
      type: object
      description: >
        Latest L1/L2/L3 hedge ratios for a fund. Empty arrays are emitted
        for levels with no non-NaN entries (e.g. small / niche funds may
        only have an L1 market hedge). Composing a full hedge basket
        means concatenating L1 + L2 + L3 entries.
      required: [bw_fund_id, teo, L1, L2, L3]
      properties:
        bw_fund_id: { type: string }
        ticker: { type: string, nullable: true }
        fund_name: { type: string, nullable: true }
        equity_style_9box: { type: string, nullable: true }
        teo: { type: string, format: date }
        L1:
          type: array
          items: { $ref: "#/components/schemas/FundHedgeLeg" }
        L2:
          type: array
          items: { $ref: "#/components/schemas/FundHedgeLeg" }
        L3:
          type: array
          items: { $ref: "#/components/schemas/FundHedgeLeg" }

    FundHolding:
      type: object
      description: One holding (security) within a fund's top-N snapshot.
      required: [bw_sym_id, adj_mv]
      properties:
        bw_sym_id:
          type: string
          description: Internal symbol id. Resolve to ticker via /api/data/symbols/batch.
          example: BW-BBG000B9XRY4
        adj_mv:
          type: number
          format: float
          description: Adjusted market value of this position at the snapshot teo.
        weight:
          type: number
          format: float
          nullable: true
          description: Fraction of `aum_erm3`. Null when aum_erm3 is null/0.

    FundHoldingsResponse:
      type: object
      description: >
        Top-N current holdings for a fund at the latest teo. Sourced from
        per-fund `ds_ph.zarr` (Slice 5). `aum_reported` is sum(adj_mv)
        BEFORE universe filter; `aum_erm3` is sum AFTER (ERM3-mapped
        symbols only — the denominator for `weight`).
      required: [bw_fund_id, teo, n_holdings_returned, n_total_holdings, holdings]
      properties:
        bw_fund_id: { type: string }
        ticker: { type: string, nullable: true }
        fund_name: { type: string, nullable: true }
        equity_style_9box: { type: string, nullable: true }
        teo: { type: string, format: date }
        aum_reported: { type: number, format: float, nullable: true }
        aum_erm3: { type: number, format: float, nullable: true }
        n_holdings_returned: { type: integer, example: 25 }
        n_total_holdings: { type: integer, example: 503 }
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/FundHolding"

    FundPortfolioRow:
      type: object
      description: One teo (month-end) of a fund's portfolio time series.
      required: [teo]
      properties:
        teo: { type: string, format: date, example: "2026-04-30" }
        portfolio_gross_return: { type: number, format: float, nullable: true }
        portfolio_market_return: { type: number, format: float, nullable: true }
        portfolio_sector_return: { type: number, format: float, nullable: true }
        portfolio_subsector_return: { type: number, format: float, nullable: true }
        portfolio_idiosyncratic_return: { type: number, format: float, nullable: true }
        identity_residual: { type: number, format: float, nullable: true }
        weight_sum: { type: number, format: float, nullable: true }
        n_holdings_active: { type: integer, nullable: true }
        effective_n: { type: number, format: float, nullable: true }
        top10_weight_sum: { type: number, format: float, nullable: true }

    FundPortfolioHistoryResponse:
      type: object
      description: >
        Per-fund portfolio time series. Long-form rows indexed by teo
        (month-end). The `start_teo` / `end_teo` summary fields reflect
        the post-filter window, not the full panel.
      required: [bw_fund_id, n_periods, start_teo, end_teo, rows]
      properties:
        bw_fund_id: { type: string }
        ticker: { type: string, nullable: true }
        fund_name: { type: string, nullable: true }
        equity_style_9box: { type: string, nullable: true }
        n_periods: { type: integer, example: 85 }
        start_teo: { type: string, format: date }
        end_teo: { type: string, format: date }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/FundPortfolioRow"

    FundNavRow:
      type: object
      description: >
        One month-end NAV observation from yfinance. Pairs with
        `FundPortfolioRow` on the same teo: the portfolio row is 13F-derived
        attribution, the NAV row is what investors actually realised.
      required: [teo]
      properties:
        teo: { type: string, format: date, example: "2026-04-30" }
        nav_close:
          type: number
          format: float
          nullable: true
          description: Month-end close price from yfinance.
        nav_return_monthly:
          type: number
          format: float
          nullable: true
          description: pct_change of consecutive month-end closes (the realised return).

    FundNavHistoryResponse:
      type: object
      description: >
        Per-fund NAV time series. Same shape as the portfolio history
        response — rows indexed by teo (month-end), filtered to the
        post-`start_date` / pre-`end_date` window.
      required: [bw_fund_id, n_periods, start_teo, end_teo, rows]
      properties:
        bw_fund_id: { type: string }
        ticker: { type: string, nullable: true }
        fund_name: { type: string, nullable: true }
        equity_style_9box: { type: string, nullable: true }
        n_periods: { type: integer, example: 196 }
        start_teo: { type: string, format: date }
        end_teo: { type: string, format: date }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/FundNavRow"

    FundMetricsResponse:
      type: object
      description: >
        Latest knowledge-mode metrics for a single mutual fund. Joins
        `public.funds` (registry) with `public.funds_latest` (the wide-row
        snapshot) and groups return components / diagnostics / meta into
        nested objects. Bitemporal triple is at the top level; lineage in
        `_metadata`.
      required: [bw_fund_id, report_date, filing_date, extracted_at, returns, diagnostics, meta, _metadata]
      properties:
        bw_fund_id: { type: string, example: BW-FUND-S000004310 }
        ticker: { type: string, nullable: true, example: VFINX }
        fund_name: { type: string, nullable: true }
        equity_style_9box:
          type: string
          nullable: true
          enum:
            - Large Value
            - Large Blend
            - Large Growth
            - Mid Value
            - Mid Blend
            - Mid Growth
            - Small Value
            - Small Blend
            - Small Growth
        report_date: { type: string, format: date, example: "2026-04-30" }
        filing_date: { type: string, format: date, example: "2026-07-14" }
        extracted_at: { type: string, format: date-time }
        returns:
          type: object
          description: Portfolio-level return components from the per-fund Slice 8 zarr.
          properties:
            gross: { type: number, format: float, nullable: true }
            market: { type: number, format: float, nullable: true }
            sector: { type: number, format: float, nullable: true }
            subsector: { type: number, format: float, nullable: true }
            idiosyncratic: { type: number, format: float, nullable: true }
            identity_residual:
              type: number
              format: float
              nullable: true
              description: L3 noise diagnostic (gross − sum of layer returns).
        diagnostics:
          type: object
          properties:
            weight_sum:
              type: number
              format: float
              nullable: true
              description: ERM3 universe coverage (fraction of fund AUM in mapped symbols).
            n_holdings_active: { type: integer, nullable: true }
            effective_n:
              type: number
              format: float
              nullable: true
              description: HHI-derived diversification (1 / sum(w_i^2)).
            top10_weight_sum: { type: number, format: float, nullable: true }
        meta:
          type: object
          properties:
            total_adj_mv: { type: number, format: float, nullable: true }
            n_funds_in_cell_at_report_date: { type: integer, nullable: true }
            morningstar_category: { type: string, nullable: true }
            primary_bw_fund_id: { type: string, nullable: true }
        _metadata:
          type: object
          properties:
            model_version:
              type: string
              nullable: true
              example: funds_dag.v20260502
            factor_set_id:
              type: string
              nullable: true
              example: uni_mc_3000_SPY
            data_as_of: { type: string, format: date }
            data_freshness: { type: string, format: date-time }
            last_synced_at: { type: string, format: date-time }

security:
  - BearerAuth: []

paths:
  /auth/token:
    post:
      summary: Generate OAuth2 Access Token
      description: >
        OAuth 2.0 client credentials flow for machine-to-machine authentication.
        Exchange API credentials for a short-lived JWT token (15 minutes).


        **Use Cases:**

        - AI agents connecting to the API

        - Server-to-server integrations

        - npm package authentication

        - MCP client authentication
      operationId: generateOAuthToken
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuth2TokenRequest"
            example:
              grant_type: client_credentials
              client_id: rm_agent_live_abc123
              client_secret: rm_agent_live_abc123_xyz789_checksum
              scope: ticker-returns risk-decomposition
      responses:
        "200":
          description: Access token generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuth2TokenResponse"
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type: Bearer
                expires_in: 900
                scope: ticker-returns risk-decomposition batch-analysis
        "400":
          description: Invalid request (missing or invalid grant_type)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuth2Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuth2Error"

  /mcp/sse:
    get:
      summary: MCP Streamable HTTP Connection
      description: >
        Model Context Protocol endpoint using the Streamable HTTP transport
        (successor to the legacy SSE+companion-POST pattern). A single URL
        handles both `GET` (optional server→client event stream) and `POST`
        (client→server JSON-RPC 2.0 messages).


        **Discovery:** The MCP server manifest is published at
        `https://riskmodels.app/.well-known/mcp.json` for automated client discovery.


        **Connection:**

        - Transport: Streamable HTTP (stateless mode)

        - Authentication: `Authorization: Bearer <key>` (preferred) or
          `?api_key=<key>` query param (for `EventSource`, which can't set
          custom headers).

        - Tool-call billing: charged per-invocation on the underlying REST
          endpoint (e.g. `get_metrics` bills the same as `GET /metrics/{ticker}`).

        - **POST requests:** send `Accept: application/json, text/event-stream` (required by some MCP clients;
          omitting it can yield **406 Not Acceptable**).


        **Usage — mcp-remote proxy:**

        ```json

        {
          "mcpServers": {
            "riskmodels": {
              "command": "npx",
              "args": ["mcp-remote", "https://riskmodels.app/api/mcp/sse"],
              "env": { "AUTHORIZATION": "Bearer rm_agent_live_..." }
            }
          }
        }

        ```
      operationId: mcpServerSSE
      tags:
        - MCP
      security:
        - BearerAuth: []
        - OAuth2ClientCredentials: ["*"]
      responses:
        "200":
          description: SSE connection established
          content:
            text/event-stream:
              schema:
                type: string
                format: event-stream
              example: |
                data: {"jsonrpc":"2.0","method":"notifications/initialized","params":{...}}

                data: {"jsonrpc":"2.0","method":"notifications/ping","params":{"timestamp":1234567890}}
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "429":
          description: Rate limit exceeded.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitExceeded"

    post:
      summary: MCP JSON-RPC Request
      description: >
        Send JSON-RPC 2.0 messages to the MCP server.


        **Available methods:**

        - `tools/list` - List available MCP tools

        - `tools/call` - Invoke an MCP tool

        - `resources/list` - List available resources

        - `resources/read` - Read a resource
      operationId: mcpServerRPC
      tags:
        - MCP
      security:
        - BearerAuth: []
        - OAuth2ClientCredentials: ["*"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jsonrpc
                - method
                - id
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                method:
                  type: string
                  example: tools/call
                params:
                  type: object
                id:
                  oneOf:
                    - type: string
                    - type: integer
            example:
              jsonrpc: "2.0"
              method: tools/call
              params:
                name: riskmodels_get_capability
                arguments:
                  id: ticker-returns
              id: 1
      responses:
        "200":
          description: JSON-RPC response
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    enum: ["2.0"]
                  result:
                    type: object
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                  id:
                    oneOf:
                      - type: string
                      - type: integer
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "429":
          description: Rate limit exceeded.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitExceeded"

