                      period:
                        type: string
                      total_invoices:
                        type: integer
                      total_spent_usd:
                        type: number
                        format: float
                      total_requests:
                        type: integer
                      current_period_cost_usd:
                        type: number
                        format: float
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "429":
          description: Rate limit exceeded.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitExceeded"

  /auth/provision:
    post:
      summary: Provision an API key
      description: >
        Exchange a valid session JWT for a long-lived Bearer API key in format
        `rm_agent_{live|test}_{random}_{checksum}`. Intended for AI agents that need
        a stable key for repeated calls.
      operationId: provisionToken
      tags: [Authentication]
      responses:
        "200":
          description: New API key provisioned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
                    example: rm_agent_live_a1b2c3d4_xyz789
                  environment:
                    type: string
                    enum: [live, test]
                  created_at:
                    type: string
                    format: date-time
        "401":
          description: Missing or invalid session JWT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/provision-free:
    post:
      summary: Provision a free-tier API key
      description: >
        Generate a free API key with limited daily usage (100 req/day, 10 req/min).
        No payment or email required. Returns the key once — store it immediately.
      operationId: provisionFreeToken
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_name]
              properties:
                agent_name:
                  type: string
                  minLength: 3
                  description: Display name for the free-tier agent (≥ 3 characters).
                  example: my-research-bot
                purpose:
                  type: string
                  description: Optional description of intended use.
                  default: development
      responses:
        "201":
          description: Free API key created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    type: object
                    properties:
                      user_id: { type: string }
                      agent_name: { type: string }
                      tier: { type: string, enum: [free] }
                      limits:
                        type: object
                        properties:
                          queries_per_day: { type: integer, example: 100 }
                          queries_per_minute: { type: integer, example: 10 }
                  credentials:
                    type: object
                    properties:
                      api_key:
                        type: string
                        description: Shown only once. Store securely.
                        example: rm_agent_live_abc123_xyz
                      prefix: { type: string }
        "400":
          description: Invalid agent_name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/free-tier-status:
    get:
      summary: Free-tier usage status
      description: >
        Returns current daily usage and remaining quota for a free-tier API key.
        Authenticated with Bearer token. Returns HTTP 200 with `tier` field for
        non-free accounts.
      operationId: getFreeTierStatus
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Free-tier usage status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tier: { type: string, example: free }
                  user_id: { type: string }
                  usage:
                    type: object
                    properties:
                      queries_today: { type: integer }
                      queries_this_month: { type: integer }
                      remaining_today: { type: integer }
                  limits:
                    type: object
                    properties:
                      queries_per_day: { type: integer, example: 100 }
                      queries_per_minute: { type: integer, example: 10 }
                  reset_date: { type: string, format: date-time }
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No account found for this API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cli/query:
    post:
      summary: Raw SQL query (SELECT only)
      description: >
        Execute a read-only SQL SELECT against the RiskModels database. Only SELECT
        statements are permitted; DML and DDL are rejected. Results capped at 10,000
        rows. Billed as `cli-query` capability. Requires valid Bearer token with
        billing balance.
      operationId: cliQuery
      tags: [Utility]
      x-pricing:
        capability_id: cli-query
        tier: baseline
        model: per_request
        cost_usd: 0.003
        currency: USD
        billing_code: cli_query_v1
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                sql:
                  type: string
                  description: SELECT statement to execute. Multi-statement and DML/DDL are rejected.
                  example: SELECT ticker, symbol FROM symbols LIMIT 10
                limit:
                  type: integer
                  description: Max rows to return if no LIMIT clause in sql (default 100, max 10000).
                  default: 100
      responses:
        "200":
          description: Query results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { type: object }
                  count: { type: integer }
                  sql:
                    {
                      type: string,
                      description: Executed SQL (may have LIMIT appended).,
                    }
        "400":
          description: Invalid or disallowed SQL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"

  /telemetry:
    get:
      summary: Telemetry metrics
      description: >
        Performance and reliability metrics for API capabilities. Optional filter by
        capability and number of days. Cost: $0.002/call.
      operationId: getTelemetry
      tags: [Utility]
      x-pricing:
        capability_id: telemetry-metrics
        tier: baseline
        model: per_request
        cost_usd: 0.002
        currency: USD
        billing_code: telemetry_v2
      parameters:
        - name: capability
          in: query
          required: false
          schema:
            type: string
          description: Specific capability id to get metrics for.
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 90
          description: Number of days of historical data.
      responses:
        "200":
          description: Telemetry metrics for the requested period.
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "429":
          description: Rate limit exceeded.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitExceeded"

  /chat:
    post:
      summary: AI Risk Analyst
      description: >
        Natural language risk analysis with OpenAI tool calling against RiskModels data (DAL).
        LLM tokens are billed per the chat capability; each internal tool call is billed separately
        at the same rates as the corresponding REST endpoints (e.g. metrics-snapshot, ticker-returns).
        search_tickers is free. Returns tool_calls_summary and expanded _agent (llm_cost_usd, tool_cost_usd, tool_calls).
      operationId: postChat
      tags: [Risk Metrics]
      x-pricing:
        capability_id: chat-risk-analyst
        tier: premium
        model: per_token
        currency: USD
        billing_code: chat_risk_analyst_v2
        input_cost_per_1k: 0.001
        output_cost_per_1k: 0.002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
                model:
                  type: string
                  description: AI model to use (default gpt-4o-mini)
                response_mode:
                  type: string
                  enum: [markdown, catalog, hybrid]
                  description: Reserved for future streaming / A2UI modes; non-streaming JSON today.
                parallel_tool_calls:
                  type: boolean
                  description: >
                    When false, sets OpenAI parallel_tool_calls to false. Omit or true for parallel
                    tool execution on supported models (e.g. gpt-4o-mini).
                execute_tools_sequentially:
                  type: boolean
                  description: When true, server executes tool calls sequentially instead of concurrently.
      responses:
        "200":
          description: >
            Assistant reply, accumulated token usage across tool rounds, optional tool_calls_summary,
            lineage metadata, and _agent cost breakdown (LLM + tools).
          headers:
            X-API-Cost-USD:
              schema: { type: string }
            X-Data-Fetch-Latency-Ms:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [assistant]
                      content:
                        type: string
                  model:
                    type: string
                  usage:
                    type: object
                    nullable: true
                    properties:
                      prompt_tokens: { type: integer }
                      completion_tokens: { type: integer }
                      total_tokens: { type: integer }
                  tool_calls_summary:
                    type: array
                    nullable: true
                    items:
                      $ref: "#/components/schemas/ChatToolCallSummary"
                  _metadata:
                    type: object
                    additionalProperties: true
                  _agent:
                    $ref: "#/components/schemas/AgentMeta"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "429":
          description: Rate limit exceeded.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitExceeded"
        "502":
          description: Upstream AI provider error.
        "503":
          description: Chat not configured (e.g. missing MOONSHOT_API_KEY).

  /pricing:
    get:
      summary: Public capability pricing manifest
      description: >
        Machine-readable pricing for all registered capabilities (tier, model, `cost_usd`, token rates,
        `min_charge`, `billing_code`). Public; no authentication. Cached at the edge.
      operationId: getPricingManifest
      tags: [Discovery]
      security: []
      responses:
        "200":
          description: Pricing manifest JSON (`version`, `currency`, `tiers`, `endpoints`, `estimate_endpoint`, `docs`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /data/funds/{bw_fund_id}:
    get:
      summary: Get fund (registry + latest snapshot)
      description: >
        Returns the registry row from `public.funds` joined with the latest
        knowledge-mode snapshot from `public.funds_latest`. Bitemporal lineage
        surfaces as response headers `X-Data-As-Of` (= `report_date`) and
        `X-Data-Filing-Date` (= `filing_date`).


        v1 returns the latest knowledge-mode answer only (no `?as_of=` /
        `?mode=` query params — deferred to v2 per
        ARCHITECTURE_FUNDS_API.md §3.5).
      operationId: getFundDataPlane
      tags: [Funds Data Plane]
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: bw_fund_id
          in: path
          required: true
          schema: { type: string }
          example: BW-FUND-S000004310
      responses:
        "200":
          description: Fund + latest snapshot.
          headers:
            X-Data-As-Of:
              schema: { type: string, format: date }
              description: funds_latest.report_date (period end of the snapshot).
            X-Data-Filing-Date:
              schema: { type: string, format: date }
              description: funds_latest.filing_date (SEC acceptance date).
            X-Risk-Model-Version:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundWithLatest"
        "404":
          description: Fund not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /data/funds-latest/{bw_fund_id}:
    get:
      summary: Get just the funds_latest row
      description: >
        Returns only the wide-row snapshot from `public.funds_latest`. Skips
        the registry join — useful when the SDK already has the registry row
        or only needs the metric columns.
      operationId: getFundLatestDataPlane
      tags: [Funds Data Plane]
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: bw_fund_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Latest snapshot row.
          headers:
            X-Data-As-Of:
              schema: { type: string, format: date }
            X-Data-Filing-Date:
              schema: { type: string, format: date }
            X-Risk-Model-Version:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundLatest"
        "404":
          description: No funds_latest row for this fund.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /data/funds/batch:
    post:
      summary: Resolve multiple funds in one call
      description: >
        Multi-fund lookup. Returns a registry+latest payload keyed by
        `bw_fund_id`. Up to 1000 ids per request.
      operationId: postFundsBatchDataPlane
      tags: [Funds Data Plane]
      security:
        - BearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundsBatchRequest"
      responses:
        "200":
          description: Lookup map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundsBatchResponse"
        "400":
          description: Invalid body (missing/oversized fund_ids array).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /data/funds/search:
    get:
      summary: Search funds by ticker or name
      description: >
        Full-text ilike search over `ticker` and `fund_name`, optionally
        filtered by 9-box style cell (slug or canonical name) and
        share-class primary flag (`?primary=true` filters
        `primary_bw_fund_id IS NULL`).
      operationId: getFundsSearchDataPlane
      tags: [Funds Data Plane]
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: ilike pattern on ticker / fund_name.
        - name: equity_style_9box
          in: query
          schema: { type: string }
          description: 9-box slug ("large-blend") or canonical name ("Large Blend").
        - name: primary
          in: query
          schema: { type: boolean, default: false }
          description: When true, returns only primary share-class funds (Q5 lock).
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        "200":
          description: Up to `limit` matching funds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundsSearchResponse"

  /data/funds/style/{slug}/members:
    get:
      summary: List fund_ids in a 9-box style cell
      description: >
        Returns the `bw_fund_id` list for a 9-box style cell. SDK consumers
        typically chain this into `/api/data/funds/batch` to materialize a
        peer cohort's full registry+latest payload.
      operationId: getStyleCellMembersDataPlane
      tags: [Funds Data Plane]
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            enum:
              - large-value
              - large-blend
              - large-growth
              - mid-value
              - mid-blend
              - mid-growth
              - small-value
              - small-blend
              - small-growth
        - name: primary
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20000, default: 5000 }
      responses:
        "200":
          description: Fund id list for the cell.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundsStyleMembersResponse"
        "400":
          description: Invalid style slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /data/etf/search:
    get:
      summary: ETF search & discovery (free)
      description: >
        Free discovery endpoint for ETFs in the canonical universe. Substring +
        prefix search over ticker / name in the committed catalog
        (`mcp/data/etf_master.json`). Symmetric to `/api/data/funds/search` and
        `/api/13f/filers/search`. Empty `q` returns the universe (capped at `limit`).


        Ranking (higher = better): 100 exact ticker; 70 ticker prefix;
        50 ticker substring; 40 name word-boundary prefix; 30 name substring.
        Public read; soft gateway auth.
      operationId: searchEtfs
      tags: [Funds Data Plane]
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          example: SPY
          description: Search query — ticker or partial name. Case-insensitive.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: ETF search results (possibly empty).
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  n_results: { type: integer }
                  n_universe: { type: integer, description: Total ETFs in the catalog. }
                  schema_version: { type: string, example: etf-master/2.0 }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        bw_etf_id: { type: string, example: BW-ETF-IVV }
                        ticker: { type: string, example: IVV }
                        name: { type: string }
                        score: { type: integer, description: Match score (higher = better). }

  /data/etf/{ticker}:
    get:
      summary: ETF base metrics (canonical PortfolioSurface)
      description: >
        Latest knowledge-mode metrics for a single ETF — registry-level metadata
        (`portfolio_id`, `ticker`, `source_kind`, `teo_frequency`, `sponsor`) +
        the latest aggregate metrics from the canonical PortfolioSurface zarr
        (`aum_reported`, `aum_erm3`, `coverage_pct`, `n_total_holdings`,
        `report_date`, `availability_date`).


        Symmetric to `/api/data/funds/{bw_fund_id}` and
        `/api/13f/filers/{bw_filer_id}` — closes the "base entity metrics"
        parity gap for the ETF surface. MASTER_BACKLOG L.6 / D.9.


        Bitemporal lineage on response headers — never collapsed: `X-Data-As-Of`
        (= `report_date`) and `X-Data-Availability` (= `availability_date`). No
        per-holding rows — call `/api/data/etf/{ticker}/holdings` for those.
      operationId: getEtfMetricsDataPlane
      tags: [Funds Data Plane]
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: ticker
          in: path
          required: true
          schema: { type: string }
          example: IVV
      responses:
        "200":
          description: ETF latest metrics block.
          headers:
            X-Data-As-Of:
              schema: { type: string, format: date }
              description: report_date — the sponsor's "Fund Holdings as of" date.
            X-Data-Availability:
              schema: { type: string, format: date }
              description: availability_date — when that holdings file was first observed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  portfolio_id: { type: string, example: BW-ETF-IVV }
                  ticker: { type: string, example: IVV }
                  source_kind: { type: string, enum: [etf] }
                  teo_frequency: { type: string, enum: [daily] }
                  sponsor: { type: string, nullable: true, example: ishares }
                  report_date: { type: string, format: date }
                  availability_date: { type: string, format: date, nullable: true }
                  aum_reported: { type: number, nullable: true }
                  aum_erm3: { type: number, nullable: true }
                  coverage_pct:
                    type: number
                    nullable: true
                    description: aum_erm3 / aum_reported — in-ERM3 share of the resolved sleeve.
                  n_total_holdings: { type: integer }
        "404":
          description: ETF not found or no holdings available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /data/etf/{ticker}/holdings:
    get:
      summary: ETF top-N holdings (canonical PortfolioSurface)
      description: >
        Top-N current holdings of an ETF, read from its canonical
        `PortfolioSurface` zarr (Funds_DAG `etf_holdings_zarr` — `source_kind=etf`,
        `teo_frequency=daily`). Only the in-ERM3 sleeve is materialized, so every
        holding carries a `bw_sym_id` (resolve to ticker/name via
        `/api/data/symbols/batch`). `report_date` (the sponsor's "Fund Holdings
        as of" date) and `availability_date` (when that file was first observed)
        are surfaced distinctly — never collapsed — and also as headers
        `X-Data-As-Of` (= `report_date`) and `X-Data-Availability`
        (= `availability_date`).


        v1 returns the latest snapshot only (no `?as_of=` query). See
        docs/architecture/CANONICAL_INTELLIGENCE_OBJECTS.md §9.
      operationId: getEtfHoldingsDataPlane
      tags: [Funds Data Plane]
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: ticker
          in: path
          required: true
          schema: { type: string }
          example: IVV
        - name: top
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 25 }
      responses:
        "200":
          description: ETF holdings snapshot.
          headers:
            X-Data-As-Of:
              schema: { type: string, format: date }
              description: report_date — the sponsor's "Fund Holdings as of" date.
            X-Data-Availability:
              schema: { type: string, format: date }
              description: availability_date — when that holdings file was first observed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  portfolio_id: { type: string, example: BW-ETF-IVV }
                  ticker: { type: string, example: IVV }
                  source_kind: { type: string, enum: [etf] }
                  teo_frequency: { type: string, enum: [daily] }
                  sponsor: { type: string, nullable: true, example: ishares }
                  report_date: { type: string, format: date }
                  availability_date: { type: string, format: date, nullable: true }
                  aum_reported: { type: number, nullable: true }
                  aum_erm3: { type: number, nullable: true }
                  coverage_pct:
                    type: number
                    nullable: true
                    description: aum_erm3 / aum_reported — in-ERM3 share of the resolved sleeve.
                  n_holdings_returned: { type: integer }
                  n_total_holdings: { type: integer }
                  holdings:
                    type: array
                    items:
                      type: object
                      properties:
                        bw_sym_id: { type: string }
                        adj_mv: { type: number }
                        weight: { type: number, nullable: true }
        "404":
          description: ETF not found or no holdings available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /data/etf/{ticker}/portfolio:
    get:
      summary: ETF L1/L2/L3 return decomposition time series
      description: >
        An ETF's portfolio return decomposition (Funds_DAG `surface_portfolios_zarr`)
        — same `(teo,)` schema as `/api/funds/{bw_fund_id}/portfolio`:
        `portfolio_{gross,market,sector,subsector,idiosyncratic}_return`,
        `identity_residual`, `weight_sum`, `n_holdings_active`, `effective_n`,
        `top10_weight_sum`. The response reports `weight_basis` — v1 =
        `latest_holdings_constant` (the factor profile of the ETF's *current*
        composition over ERM3 monthly's full history; the time-varying month-end
        basis matching the per-fund semantic is a follow-on) — and `variance_shares`
        (the diversification-credited full-window market/sector/subsector/residual
        shares). Soft gateway auth (public read).
      operationId: getEtfPortfolioSeries
      tags: [Funds Data Plane]
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: ticker
          in: path
          required: true
          schema: { type: string }
          example: IWM
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: ETF portfolio decomposition time series.
          headers:
            X-Data-As-Of:
              schema: { type: string, format: date }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurfacePortfolioSeries"
        "404":
          description: ETF not found or no portfolio decomposition available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /data/benchmark/{id}:
    get:
      summary: Benchmark surface + BenchmarkContext
      description: >
        A benchmark's canonical PortfolioSurface snapshot (Funds_DAG
        `benchmark_surfaces_zarr` — `source_kind=benchmark`): the
        `BenchmarkContext` (the immutable definition — methodology, rebalance
        schedule, observation semantics, `benchmark_kind`, proxy/components) plus
        the latest constituent weight vector (top-N). `id` accepts a
        `bw_bench_id` (e.g. `BW-BENCH-SPY`) or an alias (e.g. `SPY`, `70/30`).
        v1 catalog: SPY (index_proxy ← IVV's holdings), EQ70-30 (blend: 70% IWB +
        30% IWM). `report_date` (the surface's latest teo) and
        `availability_date` are surfaced distinctly + as headers
        `X-Data-As-Of` / `X-Data-Availability`. See
        docs/architecture/CANONICAL_INTELLIGENCE_OBJECTS.md §9.
      operationId: getBenchmarkSurface
      tags: [Funds Data Plane]
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: SPY
        - name: top
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 25 }
      responses:
        "200":
          description: Benchmark surface snapshot + context.
          headers:
            X-Data-As-Of:
              schema: { type: string, format: date }
            X-Data-Availability:
              schema: { type: string, format: date }
          content:
            application/json:
              schema:
                type: object
                properties:
                  benchmark_context_id: { type: string, example: BW-BENCH-SPY }
                  name: { type: string }
                  benchmark_kind: { type: string, enum: [index_proxy, blend, peer_cohort, constructed_hedge] }
                  source_kind: { type: string, enum: [benchmark] }
                  teo_frequency: { type: string }
                  report_date: { type: string, format: date }
                  availability_date: { type: string, format: date, nullable: true }
                  benchmark_context:
                    type: object
                    nullable: true
                    description: The full serialized BenchmarkContext (methodology, rebalance_schedule, aliases, proxy/components, …).
                  n_constituents: { type: integer }
                  top_constituents:
                    type: array
                    items:
                      type: object
                      properties:
                        bw_sym_id: { type: string }
                        weight: { type: number }
        "404":
          description: Benchmark not found (unknown id/alias or missing surface).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /data/benchmark-fit:
    get:
      summary: BenchmarkFit — fit a portfolio surface to a benchmark
      description: >
        `BenchmarkFit` (the comparison facet — CANONICAL_INTELLIGENCE_OBJECTS.md
        §9): fit a subject portfolio's weight vector against a benchmark surface
        at a common teo (the subject's latest teo ≤ `as_of`; the benchmark then
        at its latest teo ≤ the subject's teo — never peeking ahead). Returns
        active share, an active-weight RMS (a coarse tracking-error *proxy* —
        factor-based TE is a follow-on), overlap, and the top over/underweights.
        `subject` = a `BW-*` portfolio id (`BW-FUND-…`, `BW-FILER-…`,
        `BW-ETF-…`, `BW-BENCH-…`) or an ETF ticker (→ `BW-ETF-{TICKER}`);
        `benchmark` = a `bw_bench_id` or an alias (`SPY`, `70/30`, …).
      operationId: getBenchmarkFit
      tags: [Funds Data Plane]
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: subject
          in: query
          required: true
          schema: { type: string }
          example: BW-FUND-S000004310
        - name: benchmark
          in: query
          required: true
          schema: { type: string }
          example: SPY
        - name: as_of
          in: query
          schema: { type: string, format: date }
        - name: top
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: BenchmarkFit result.
          headers:
            X-Data-As-Of:
              schema: { type: string, format: date }
              description: the subject surface teo the fit was computed at.
            X-Benchmark-As-Of:
              schema: { type: string, format: date }
              description: the benchmark surface teo the fit was computed at.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fit_schema_version: { type: string }
                  subject_id: { type: string }
                  subject_source_kind: { type: string }
                  benchmark_context_id: { type: string }
                  benchmark_name: { type: string }
                  subject_teo: { type: string, format: date }
                  benchmark_teo: { type: string, format: date }
                  n_subject_holdings: { type: integer }
                  n_benchmark_constituents: { type: integer }
                  n_overlap: { type: integer }
                  active_share: { type: number }
                  active_weight_rms: { type: number, description: coarse tracking-error proxy }
                  weight_in_benchmark: { type: number }
                  benchmark_coverage: { type: number }
                  top_overweights:
                    type: array
                    items:
                      type: object
                      properties:
                        bw_sym_id: { type: string }
                        subject_weight: { type: number }
                        benchmark_weight: { type: number }
                        active_weight: { type: number }
                  top_underweights:
                    type: array
                    items:
                      type: object
                      properties:
                        bw_sym_id: { type: string }
                        subject_weight: { type: number }
                        benchmark_weight: { type: number }
                        active_weight: { type: number }
        "400":
          description: Missing/invalid query params.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown benchmark, or no surface for the subject/benchmark.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

