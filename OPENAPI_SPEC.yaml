          description: Top-N ranked rows.
          headers:
            X-Data-As-Of: { schema: { type: string, format: date } }
            X-Data-Filing-Date: { schema: { type: string, format: date } }
            X-API-Cost-USD: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleCohortRankingsResponse"
        "400":
          description: Invalid slug, cohort_type, period_window, weighting, or missing metric.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "402":
          description: Insufficient prepaid balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InsufficientBalance" }
        "404":
          description: No rankings for this combination.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateLimitExceeded" }

  /funds/{bw_fund_id}/hedge:
    get:
      summary: Latest fund hedge ratios (L1 / L2 / L3)
      description: >
        Latest L1/L2/L3 ETF hedge ratios for a fund. Reads `L{1,2,3}_HR
        (teo, symbol)` from Slice 7's per-fund `ds_hr.zarr` at the
        latest teo. Empty arrays are emitted for levels with no non-NaN
        entries (small / niche funds may only have an L1 market hedge).
      operationId: getFundHedge
      tags: [Funds]
      x-pricing:
        capability_id: fund-hedge
        tier: baseline
        cost_usd: 0.005
        billing_code: fund_hedge_v1
      parameters:
        - name: bw_fund_id
          in: path
          required: true
          schema: { type: string }
          example: BW-FUND-S000004310
      responses:
        "200":
          description: Per-level hedge legs.
          headers:
            X-Data-As-Of:
              schema: { type: string, format: date }
            X-Data-Filing-Date:
              schema: { type: string, format: date }
            X-API-Cost-USD:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundHedgeResponse"
        "402":
          description: Insufficient prepaid balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "404":
          description: Fund not found, or no hedge ratio panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitExceeded"

  /funds/{bw_fund_id}/holdings:
    get:
      summary: Top-N current fund holdings
      description: >
        Top-N holdings for a fund at the latest teo. Reads `adj_mv (symbol, teo)`
        and `aum_erm3 (teo,)` from Slice 5's per-fund `ds_ph.zarr` on GCS,
        sorts by `adj_mv` descending, and returns `bw_sym_id` + `adj_mv` +
        `weight = adj_mv / aum_erm3`. Resolve `bw_sym_id` to ticker via
        `/api/data/symbols/batch` if needed.
      operationId: getFundHoldings
      tags: [Funds]
      x-pricing:
        capability_id: fund-holdings
        tier: baseline
        cost_usd: 0.005
        billing_code: fund_holdings_v1
      parameters:
        - name: bw_fund_id
          in: path
          required: true
          schema: { type: string }
          example: BW-FUND-S000004310
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 25 }
          description: Max holdings to return (default 25).
      responses:
        "200":
          description: Top-N holdings snapshot.
          headers:
            X-Data-As-Of:
              schema: { type: string, format: date }
              description: Latest teo in the per-fund holdings panel.
            X-Data-Filing-Date:
              schema: { type: string, format: date }
            X-API-Cost-USD:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundHoldingsResponse"
        "400":
          description: Malformed limit param.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient prepaid balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "404":
          description: Fund not found, or no holdings panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitExceeded"

  /funds/{bw_fund_id}/portfolio:
    get:
      summary: Per-fund portfolio time series
      description: >
        Time series of portfolio-level return components and diagnostics
        from Slice 8's per-fund `ds_portfolio.zarr` on GCS. One row per
        teo (month-end). Optional inclusive `start_date` / `end_date`
        params trim the panel.


        Bitemporal: `X-Data-As-Of` reflects the latest teo in the
        returned slice; `X-Data-Filing-Date` carries the registry's
        `latest_filing_date`.
      operationId: getFundPortfolioHistory
      tags: [Funds]
      x-pricing:
        capability_id: fund-portfolio-history
        tier: baseline
        cost_usd: 0.005
        billing_code: fund_portfolio_history_v1
      parameters:
        - name: bw_fund_id
          in: path
          required: true
          schema: { type: string }
          example: BW-FUND-S000004310
        - name: start_date
          in: query
          required: false
          schema: { type: string, format: date }
          description: Inclusive lower bound (YYYY-MM-DD). Default = first teo in the fund's panel.
        - name: end_date
          in: query
          required: false
          schema: { type: string, format: date }
          description: Inclusive upper bound (YYYY-MM-DD). Default = latest teo in the fund's panel.
      responses:
        "200":
          description: Time series rows.
          headers:
            X-Data-As-Of:
              schema: { type: string, format: date }
              description: Latest teo in the returned slice.
            X-Data-Filing-Date:
              schema: { type: string, format: date }
              description: funds.latest_filing_date for the fund.
            X-API-Cost-USD:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundPortfolioHistoryResponse"
        "400":
          description: Malformed date params or start_date > end_date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient prepaid balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "404":
          description: Fund not found, or zarr returned no rows for the date window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitExceeded"

  /funds/{bw_fund_id}/nav:
    get:
      summary: Per-fund NAV time series (yfinance)
      description: >
        Time series of actual fund NAV from yfinance, resampled to month-end
        and stored in the per-fund `ds_nav.zarr` on GCS (Funds_DAG
        `fund_nav_zarr` asset). One row per teo with `nav_close`
        (month-end close) and `nav_return_monthly` (pct_change of consecutive
        closes).


        Pairs with `/funds/{bw_fund_id}/portfolio`: portfolio returns are
        13F-derived holdings attribution; NAV returns are what investors
        actually realised. The gap surfaces intra-quarter trading, fees,
        and cash drag not visible in 13F.


        Returns 404 when the fund has no yfinance-resolvable ticker
        (institutional SMAs, separately-managed accounts).


        Bitemporal: `X-Data-As-Of` reflects the latest teo in the returned
        slice; `X-Data-Filing-Date` carries the registry's
        `latest_filing_date`.
      operationId: getFundNavHistory
      tags: [Funds]
      x-pricing:
        capability_id: fund-nav-history
        tier: baseline
        cost_usd: 0.005
        billing_code: fund_nav_history_v1
      parameters:
        - name: bw_fund_id
          in: path
          required: true
          schema: { type: string }
          example: BW-FUND-S000001243
        - name: start_date
          in: query
          required: false
          schema: { type: string, format: date }
          description: Inclusive lower bound (YYYY-MM-DD). Default = first teo in the fund's NAV panel.
        - name: end_date
          in: query
          required: false
          schema: { type: string, format: date }
          description: Inclusive upper bound (YYYY-MM-DD). Default = latest teo in the fund's NAV panel.
      responses:
        "200":
          description: NAV time series rows.
          headers:
            X-Data-As-Of:
              schema: { type: string, format: date }
              description: Latest teo in the returned slice.
            X-Data-Filing-Date:
              schema: { type: string, format: date }
              description: funds.latest_filing_date for the fund.
            X-API-Cost-USD:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundNavHistoryResponse"
        "400":
          description: Malformed date params or start_date > end_date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient prepaid balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "404":
          description: Fund not found, or no NAV zarr for the date window (e.g. institutional SMA without a yfinance ticker).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitExceeded"

  /funds/{bw_fund_id}:
    get:
      summary: Latest fund metrics
      description: >
        Knowledge-mode portfolio return decomposition + diagnostics for a
        single mutual fund. Returns the gross / market / sector / subsector
        / idiosyncratic return components from the per-fund Slice 8 zarr
        (materialized in `public.funds_latest`), plus diagnostics
        (`weight_sum`, `n_holdings_active`, `effective_n`,
        `top10_weight_sum`) and registry-side meta. Bitemporal lineage on
        response headers (`X-Data-As-Of`, `X-Data-Filing-Date`).


        Per-fund time series, holdings panel, and hedge ratios live in
        GCS Zarr and ship under `/funds/{bw_fund_id}/portfolio`,
        `/holdings`, `/hedge` in Stage B.2.


        v1 returns the latest knowledge-mode answer only — `?as_of=` /
        `?mode=` is deferred to v2 (schema is forward-compatible).
      operationId: getFundMetrics
      tags: [Funds]
      x-pricing:
        capability_id: fund-metrics
        tier: baseline
        cost_usd: 0.005
        billing_code: fund_metrics_v1
      parameters:
        - name: bw_fund_id
          in: path
          required: true
          schema: { type: string }
          example: BW-FUND-S000004310
      responses:
        "200":
          description: Latest fund metrics.
          headers:
            X-Data-As-Of:
              schema: { type: string, format: date }
              description: funds_latest.report_date (period end of the snapshot).
            X-Data-Filing-Date:
              schema: { type: string, format: date }
              description: funds_latest.filing_date (SEC acceptance date).
            X-Risk-Model-Version:
              schema: { type: string }
            X-API-Cost-USD:
              schema: { type: string }
              description: USD cost deducted from prepaid balance for this request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundMetricsResponse"
        "402":
          description: Insufficient prepaid balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "404":
          description: Fund not found, or registry exists but no funds_latest row yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitExceeded"

  # =========================================================================
  # 13F Filer endpoints (D.8 Phase 1)
  # =========================================================================

  /13f/filers/search:
    get:
      summary: 13F filer search
      description: >
        Discovery surface for 13F filers. Search by name, CIK, or LEI;
        filter by filer_type / aum_tier; optionally restrict to filers
        passing the modelability gate. Free for users (no per-request
        cost) — per-filer follow-up calls are metered.
      operationId: searchFilers
      tags:
        - 13F Filers
      x-pricing:
        capability_id: filer-search
        tier: baseline
        cost_usd: 0.0
        billing_code: filer_search_v1
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: filer_type
          in: query
          required: false
          schema:
            type: string
        - name: aum_tier
          in: query
          required: false
          schema:
            type: string
        - name: modelable_only
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 500
      responses:
        "200":
          description: Filer search results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
        "429":
          description: Rate limit exceeded.

  /13f/filers/{bw_filer_id}:
    get:
      summary: Latest 13F filer metrics
      description: >
        Latest knowledge-mode portfolio metrics for a single 13F filer.
        Reads `public.filers` + `public.filer_portfolios_latest`. Returns
        diagnostics, AUM (total + in-ERM3), ERM3-coverage modelability
        inputs, and portfolio-derived 9-box style attribution. Return
        components are NULL until D.8 Phase 2. NAV is permanently absent
        — filers have no NAV time series.
      operationId: getFilerMetrics
      tags:
        - 13F Filers
      x-pricing:
        capability_id: filer-metrics
        tier: baseline
        cost_usd: 0.005
        billing_code: filer_metrics_v1
      parameters:
        - name: bw_filer_id
          in: path
          required: true
          schema:
            type: string
          example: BW-FILER-CIK0001067983
      responses:
        "200":
          description: Latest filer metrics.
          headers:
            X-Data-As-Of:
              schema:
                type: string
                format: date
            X-Data-Filing-Date:
              schema:
                type: string
                format: date
            X-Risk-Model-Version:
              schema:
                type: string
            X-API-Cost-USD:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
        "402":
          description: Insufficient prepaid balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "404":
          description: Filer not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.

  /13f/filers/{bw_filer_id}/holdings:
    get:
      summary: 13F filer top holdings
      description: >
        Top-N holdings at the filer's latest teo — or, with `as_of`, at the
        latest quarter *known* by that date (knowledge mode: selection on
        `filing_date <= as_of`; falls back to `report_date <= as_of` on
        panels without per-quarter filing dates, with the basis echoed as
        `as_of_basis`). Reads per-filer ds_ph.zarr from GCS. Each holding
        carries `security_id` (post-D.8.1 = bw_sym_id; pre-migration = a
        raw 9-char security identifier), `adj_mv`, and `weight` (fraction
        of total in-portfolio AUM). Bi-temporal stamps are body fields —
        `report_date` (valid time, = teo) and `filing_date` (knowledge
        time, EDGAR date_filed of the surviving submission; null until the
        per-quarter data fill lands) — mirrored on the X-Data-As-Of /
        X-Data-Filing-Date headers.
      operationId: getFilerHoldings
      tags:
        - 13F Filers
      x-pricing:
        capability_id: filer-holdings
        tier: baseline
        cost_usd: 0.005
        billing_code: filer_holdings_v1
      parameters:
        - name: bw_filer_id
          in: path
          required: true
          schema:
            type: string
          description: >
            Canonical filer id (BW-FILER-CIK{cik}). Composite entities
            (BW-SYNTH-*) are served by the same route; registry-only fields
            (cik, filer_type, aum_tier) return null.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
            maximum: 1000
        - name: as_of
          in: query
          required: false
          schema:
            type: string
            format: date
          description: >
            Knowledge-mode date: serve the latest quarter whose filing was
            public on or before this date. 404 when nothing was known yet.
      responses:
        "200":
          description: >
            Top-N holdings at the selected teo, with `report_date`,
            `filing_date`, and (under `as_of`) `as_of_basis`.
          content:
            application/json:
              schema:
                type: object
        "402":
          description: Insufficient prepaid balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "404":
          description: Filer not found, or no holdings panel available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.

  /13f/filers/{bw_filer_id}/portfolio:
    get:
      summary: 13F filer portfolio history
      description: >
        Per-filer portfolio time series from per-filer ds_portfolio.zarr.
        One row per teo (quarter-end) with diagnostics, AUM, ERM3 coverage,
        and portfolio style attribution. Return components are NULL until
        D.8 Phase 2 (the security-master ↔ ERM3 attribution bridge).
        Each row carries its `filing_date` (knowledge-time stamp; null
        until the per-quarter data fill lands). `as_of` filters to rows
        known by that date (`filing_date <= as_of`, falling back to
        `teo <= as_of` on panels without filing dates; basis echoed as
        `as_of_basis`).
      operationId: getFilerPortfolioHistory
      tags:
        - 13F Filers
      x-pricing:
        capability_id: filer-portfolio-history
        tier: baseline
        cost_usd: 0.005
        billing_code: filer_portfolio_history_v1
      parameters:
        - name: bw_filer_id
          in: path
          required: true
          schema:
            type: string
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: as_of
          in: query
          required: false
          schema:
            type: string
            format: date
          description: >
            Knowledge-mode date: keep only quarters whose filings were
            public on or before this date. 404 when nothing was known yet.
      responses:
        "200":
          description: Portfolio history rows (each with `filing_date`).
          content:
            application/json:
              schema:
                type: object
        "402":
          description: Insufficient prepaid balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "404":
          description: Filer not found, or no portfolio history available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.

  /13f/filers/{bw_filer_id}/concentration:
    get:
      summary: 13F filer concentration summary
      description: >
        Quarter-end concentration panel from per-filer ds_portfolio.zarr.
        Returns median and latest effective N, top-5 / top-10 weight share,
        and weight HHI over an optional date window (same underlying series
        as /portfolio, summarized for diligence).
      operationId: getFilerConcentration
      tags:
        - 13F Filers
      x-pricing:
        capability_id: filer-concentration
        tier: baseline
        cost_usd: 0.005
        billing_code: filer_concentration_v1
      parameters:
        - name: bw_filer_id
          in: path
          required: true
          schema:
            type: string
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Concentration summary (median + latest).
          content:
            application/json:
              schema:
                type: object
        "402":
          description: Insufficient prepaid balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "404":
          description: Filer not found, or no concentration panel available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.

  /13f/filers/{bw_filer_id}/snapshot:
    get:
      summary: 13F filer composed snapshot (JSON)
      description: >
        Single-call composed snapshot for a 13F filer: registry + latest
        metrics + top-25 holdings + 12mo portfolio history + cohort ranks
        (filer_type and aum_tier partitions) + portfolio-derived 9-box
        style attribution + ERM3 coverage diagnostics + modelability flag.
        NAV is intentionally absent (`_metadata.nav_applicable: false`) —
        filers have no NAV time series.
        Adds `erm3_decomposition` from filer `ds_returns_monthly.zarr` (monthly L3 rows,
        variance share attrs, latest-month waterfall) when present (D.8.22).
        Holdings may include latest daily L3 ER shares per `bw_sym_id` from
        `security_history_latest`. `hedge_sleeve` is populated when filer
        `ds_hr.zarr` exists (D.8.10 Phase 3); otherwise null.
      operationId: getFilerSnapshot
      tags:
        - 13F Filers
      x-pricing:
        capability_id: filer-snapshot-json
        tier: premium
        cost_usd: 0.01
        billing_code: filer_snapshot_json_v1
      parameters:
        - name: bw_filer_id
          in: path
          required: true
          schema:
            type: string
          description: >
            Canonical filer id (BW-FILER-CIK{cik}). Composite entities
            (BW-SYNTH-*) are served by the same route; the snapshot adds
            entity_kind: synthetic_composite, evidence_class: reconstructed,
            recipe, and composition coverage; registry-only fields return
            null.
      responses:
        "200":
          description: Composed FilerSnapshot.
          content:
            application/json:
              schema:
                type: object
        "402":
          description: Insufficient prepaid balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "404":
          description: Filer not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.

  /13f/filers/{bw_filer_id}/snapshot.pdf:
    get:
      summary: 13F filer F1 tearsheet (PDF)
      description: >
        Rendered 1-page F1 tearsheet PDF for a 13F filer. Same content as
        /snapshot (JSON). NAV section is absent by design. Server-rendered
        via headless Chromium (Playwright); requires PLAYWRIGHT_PDF_ENABLED=true
        on the API runtime.
      operationId: getFilerSnapshotPdf
      tags:
        - 13F Filers
      x-pricing:
        capability_id: filer-snapshot-pdf
        tier: premium
        cost_usd: 0.05
        billing_code: filer_snapshot_pdf_v1
      parameters:
        - name: bw_filer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF tearsheet bytes.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "402":
          description: Insufficient prepaid balance.
        "404":
          description: Filer not found.
        "503":
          description: PDF rendering disabled (PLAYWRIGHT_PDF_ENABLED unset).

tags:
  - name: Risk Metrics
    description: ERM3 factor hedge ratios, explained risk, and return decompositions.
  - name: Utility
    description: Ticker search, health, and service discovery.
  - name: Account
    description: Balance, billing, and invoice management.
  - name: Webhooks
    description: Outbound webhook subscriptions (e.g. batch completion).
  - name: Authentication
    description: API key provisioning and OAuth2 token management.
  - name: MCP
    description: Model Context Protocol server endpoints for AI agents.
  - name: Plaid Integration
    description: Live portfolio synchronization via Plaid Investments API.
  - name: Compliance
    description: AI marketplace compliance and discovery manifests.
  - name: Privacy
    description: Data handling and privacy disclosure.
  - name: Discovery
    description: Service discovery and capability manifests.
  - name: Funds Data Plane
    description: >
      Raw-shape reads against the funds Supabase tables (`funds`,
      `funds_latest`). Latest knowledge-mode snapshot only — history reads
      via the per-fund Zarr endpoints in later stages. Public; soft Bearer
      auth; not metered. The compute-bearing `/funds/*`,
      `/funds/style/*`, and `/funds/snapshot/*` surfaces ship in subsequent
      stages.
  - name: Funds
    description: >
      Compute-bearing fund endpoints. Latest metrics (Stage B.1) join
      `public.funds` with `public.funds_latest` and return a shaped
      response with bitemporal lineage. Per-fund time series, holdings,
      and hedge ratios (Stage B.2) read from GCS Zarr. Style-cohort
      surfaces (Stage C) and snapshot tearsheets (Stage D) follow.
      Billable per request.
  - name: 13F Filers
    description: >
      Compute-bearing 13F filer endpoints (D.8 Phase 1). Mirror the funds
      surface but partition by `filer_type × aum_tier` rather than
      `equity_style_9box`, and include a portfolio-derived 9-box style
      attribution block. NAV is permanently absent (filers have no NAV
      time series); hedge ratios are Phase 3 (D.8.10). Plan reference:
      BWMACRO/docs/13f_pipeline_plan.md.
