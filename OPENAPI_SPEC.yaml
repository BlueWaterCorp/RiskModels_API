  /macro-factors:
    get:
      summary: Macro factor daily return series
      description: >
        Returns long-format rows from Supabase `macro_factors` (`factor_key`, `teo`, `return_gross`) for the
        requested date range. No stock ticker is required. Omit `factors` to use all ten canonical keys
        (`inflation`, `term_spread`, `short_rates`, `credit`, `oil`, `gold`, `usd`, `volatility`,
        `bitcoin`, `vix_spot`); aliases such as `btc` → `bitcoin`, `xau`/`gld` → `gold`, and legacy v1
