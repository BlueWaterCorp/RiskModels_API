      description: >
        One-teo snapshot of close + trailing-window total returns (1d / 21d /
        63d / 252d) for **SPY + the 11 GICS sector SPDR ETFs**
        (XLE / XLB / XLI / XLY / XLP / XLV / XLF / XLK / XLC / XLU / XLRE).


