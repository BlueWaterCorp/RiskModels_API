                    required: [ticker, weight]
                    properties:
                      ticker: { type: string }
                      weight:
                        type: number
                        format: float
                        exclusiveMinimum: 0
                title:
                  type: string
                  maxLength: 200
                  description: Optional report title.
                as_of_date:
                  type: string
                  format: date
                  description: Optional label date (YYYY-MM-DD); data is still latest available from V3.
                format:
                  type: string
                  enum: [pdf, json, png]
                  default: json
                include_diversification:
                  type: boolean
                  default: false
                  description: When true, adds a `diversification` block to portfolio_risk_index with correlation-adjusted ER, credits, and chart-friendly layers[].
                window_days:
                  type: integer
                  minimum: 20
                  maximum: 2000
                  default: 252
                  description: Rolling window (trading days) for ETF return correlations. Only used when include_diversification=true.
      responses:
        "200":
          description: JSON snapshot or PDF bytes.
          headers:
            X-API-Cost-USD:
              schema: { type: string }
            X-Cache:
              schema: { type: string }
              description: MISS on first generation; HIT when served from 24h cache.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "501":
          description: format=png not supported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /snapshot:
    post:
      summary: Canonical JSON snapshot (portfolio or single ticker)
      description: >
        Per Snapshot Architecture v3, this is the canonical public analysis interface.
        One structured response shape (`snapshot / time_behavior / attribution / risk_summary`) for either
        a weighted portfolio (`type: "portfolio"`) or a single name (`type: "ticker"`):
        L3 explained-risk decomposition, L3 hedge ratios, frozen-weight daily return attribution
        (gross, market, sector/subsector strips, residual), cumulative return and drawdown over
        `lookback_days` trading days, and risk summary.

        For `type: "ticker"` the response also includes `snapshot.ticker_meta` with sector/subsector
        ETFs and the active L3 factor list. Internal endpoints `/decompose`, `/metrics/{ticker}`,
        `/portfolio/risk-snapshot`, `/batch/analyze` remain callable but are not the recommended
        public surface; new clients should use `/snapshot`.

        **Billing:** `portfolio-risk-snapshot` capability ($0.25 per request, single bundled charge).

        **Compact response:** `?compact=1` or `Prefer: return=minimal` omits `time_behavior` and `attribution`
        (large daily arrays); keeps `snapshot`, `risk_summary`, and `_metadata`.

        **Idempotency:** Optional `Idempotency-Key` header (POST). Repeating the same key with the same JSON body
        within 24h returns the cached response without a second charge when Redis is configured (`X-Idempotent-Replayed: true`).
      operationId: postCanonicalSnapshot
      tags: [Risk Metrics]
      x-pricing:
        capability_id: portfolio-risk-snapshot
        tier: premium
        model: per_request
        cost_usd: 0.25
        currency: USD
        billing_code: risk_snapshot_pdf_v1
      security:
        - BearerAuth: []
        - OAuth2ClientCredentials: ["*"]
      parameters:
        - name: compact
          in: query
          required: false
          schema:
            type: string
            enum: ["0", "1", "true", "false", "yes", "no"]
          description: When `1`, `true`, or `yes`, returns a smaller payload (drops time series blocks).
        - name: Prefer
          in: header
          required: false
          schema:
            type: string
          description: Include `return=minimal` for the same effect as `compact=1`.
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 256
          description: >
            Optional. Dedupes identical POST bodies per user for 24h; second response includes `X-Idempotent-Replayed: true`.
            Requires Upstash Redis (`UPSTASH_REDIS_REST_URL` / `UPSTASH_REDIS_REST_TOKEN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CanonicalSnapshotPortfolioRequest"
                - $ref: "#/components/schemas/CanonicalSnapshotTickerRequest"
              discriminator:
                propertyName: type
                mapping:
                  portfolio: "#/components/schemas/CanonicalSnapshotPortfolioRequest"
                  ticker: "#/components/schemas/CanonicalSnapshotTickerRequest"
      responses:
        "200":
          description: Canonical snapshot JSON (includes `_metadata` and `_agent` on the wire).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalSnapshotResponse"
                  - type: object
                    properties:
                      _metadata:
                        type: object
                        additionalProperties: true
                      _agent:
                        type: object
                        additionalProperties: true
        "400":
          description: Invalid body, mixed weight/shares styles, or unsupported `type`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"

  /metrics/{ticker}/snapshot.pdf:
    get:
      summary: Single-ticker risk snapshot PDF
      description: >
        Convenience endpoint for one-name PDF snapshot (implicit weight 1.0). Same capability and $0.25
        pricing as `POST /portfolio/risk-snapshot` with `format=pdf`. Cached 24h per authenticated user and ticker.

        **Billing:** $0.25 per successful response (not charged on cache hit).
      operationId: getMetricsTickerSnapshotPdf
      tags: [Risk Metrics]
      x-pricing:
        capability_id: portfolio-risk-snapshot
        tier: premium
        model: per_request
        cost_usd: 0.25
        currency: USD
        billing_code: risk_snapshot_pdf_v1
      security:
        - BearerAuth: []
        - OAuth2ClientCredentials: ["*"]
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
          description: US equity ticker (case-insensitive).
      responses:
        "200":
          description: PDF snapshot.
          headers:
            X-API-Cost-USD:
              schema: { type: string }
            X-Cache:
              schema: { type: string }
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid ticker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "404":
