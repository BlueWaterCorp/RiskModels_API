          example: NVDA
      responses:
        "200":
          description: Latest metrics snapshot.
          headers:
            X-API-Cost-USD:
              schema: { type: string }
              description: Cost deducted for this request (e.g. "0.001").
            X-Cache-Status:
              schema: { type: string, enum: [HIT, MISS, BYPASS] }
            X-Data-Freshness:
              schema: { type: string, format: date-time }
            X-RateLimit-Limit:
              schema: { type: integer }
              description: Request limit per minute
            X-RateLimit-Remaining:
              schema: { type: integer }
              description: Remaining requests in current window
            X-RateLimit-Reset:
              schema: { type: integer }
              description: Unix timestamp when limit resets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSnapshotResponse"
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "404":
          description: Symbol not found or no metrics row (see error message).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitExceeded"

  /fundamentals/{ticker}:
    get:
      summary: Point-in-time quarterly fundamentals (derived analytics + SEC-sourced raw)
      description: >
        Quarterly fundamentals for a single ticker, point-in-time filtered: a row is
        visible if and only if its `filed_date` is on or before `as_of` (never "latest").
        `filed_date_source` is `exact` (vendor filing date) or `approx`
        (period_end + 45 days, the 10-Q deadline, when the vendor date is missing).


        **Derived analytics + per-cell raw SEC exposure.** Rows carry TTM profitability
        ratios (`roe_ttm`, `roa_ttm`, `fcf_margin`), capital-return ratios (`payout_ratio`,
        `retention_ratio`, `buyback_ratio`, `total_payout_ratio`, `sustainable_growth`),
        `leverage_ratio`, ERM3 cascade betas with provenance, the cost-of-capital layer
        (`cost_of_equity`, `cost_of_debt`, `wacc`, `economic_profit`), and the equity-bridge
        residual + inputs mask. `sec_facts` carries RAW line items for the cells whose serving
        value is SEC XBRL (public); vendor-sourced cells are not included there.


        Numeric line items are stored at ~7 significant figures (float32) — suitable for
        analysis, not cent-level reconciliation. `gross_margin` and `operating_margin` are
        currently always null (inputs not yet in the store). `market_cap` is a current
        snapshot, not point-in-time per quarter.


        **Disclosures (also returned in every response body):**

        - Realized historical data only. No forecasts, no analyst targets, no buy/sell
          signals.

        - Coverage starts ~2009 for most filers; pre-2009 and small-cap or
          recently-IPO'd names are thin. Missing fields are null.

        - `beta_market` is a short-half-life conditional market beta, not a textbook
          long-run CAPM beta; for defensive names `cost_of_equity` can fall below the
          risk-free rate. That is a property of the conditional beta, not an error.

        - WACC uses BOOK-value weights. Market-value weights are the textbook
          convention; compute them yourself if you have market-cap access.

        - TTM sums flows over the trailing 4 reported quarters; stock quantities are
          point-in-time (ROE denominator uses trailing-4-quarter average equity).
          Ratios need 4 finite quarters or they are null.

        - `erp` (default 0.05) and `tax_rate` (default 0.21) are always
          caller-supplied parameters, echoed in the response; no equity-risk-premium
          opinion is stored.

        - `rf_rate` is the Treasury constant-maturity yield at the selected
          `rf_tenor` (3m|1y|2y|5y|10y|30y, default 10y — the valuation convention),
          sampled at the last observation on or before each quarter's period end.
          A short tenor should be paired with a bill-basis ERP or cost of capital
          is understated.


        **Authentication:** Required (API Key or OAuth2)

        **Billing:** $0.005 per request (deducted from account balance)

        **Rate Limit:** 60 requests/minute (default)


        Per-symbol, per-call only: no batch variant, no CSV/bulk export (JSON only).
      operationId: getFundamentals
      tags: [Fundamentals]
      x-pricing:
        capability_id: fundamentals
        tier: baseline
        model: per_request
        cost_usd: 0.005
        currency: USD
        billing_code: fundamentals_v1
      security:
        - BearerAuth: []
        - OAuth2ClientCredentials: [ticker-returns]
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
          description: Ticker symbol (case-insensitive).
          example: AAPL
        - name: as_of
          in: query
          required: false
          schema:
            type: string
            format: date
          description: >
            Point-in-time date. Rows are visible iff filed_date <= as_of.
            Default: today.
          example: "2026-03-31"
        - name: periods
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 40
            default: 8
          description: Number of quarterly rows returned (most recent last). Max 40.
        - name: erp
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 0.5
            default: 0.05
          description: Equity risk premium for the cost-of-capital layer (caller-supplied).
        - name: tax_rate
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 1
            default: 0.21
          description: Tax rate applied to the WACC debt shield.
        - name: rf_tenor
          in: query
          required: false
          schema:
            type: string
            enum: [3m, 1y, 2y, 5y, 10y, 30y]
            default: 10y
          description: >-
            Treasury constant-maturity tenor backing rf_rate. Default 10y (valuation
            convention). Pair a short tenor with a bill-basis ERP or cost of capital
            is understated.
        - name: grid
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            When true, the response also carries `sensitivity_grid` —
            `cost_of_equity` / `wacc` / `economic_profit` across `erp_grid` x
            `rf_tenor_grid` for the latest PIT-visible period only (not a time
            series — a "what if my assumptions were different today" table).
            Same billing as the base call; no extra cost.
        - name: erp_grid
          in: query
          required: false
          schema:
            type: string
          description: >-
            Comma-separated ERP values for the sensitivity grid (1-10 values,
            each in [0, 0.5]), e.g. `0.03,0.04,0.05,0.06,0.07`. Ignored unless
            `grid=true`. Default: `0.03,0.04,0.05,0.06,0.07`.
          example: "0.03,0.04,0.05,0.06,0.07"
        - name: rf_tenor_grid
          in: query
          required: false
          schema:
            type: string
          description: >-
            Comma-separated subset of `3m,1y,2y,5y,10y,30y` for the
            sensitivity grid. Ignored unless `grid=true`. Default: all six
            tenors.
          example: "1y,10y,30y"
      responses:
        "200":
          description: PIT quarterly fundamentals rows.
          headers:
            X-API-Cost-USD:
              schema: { type: string }
              description: Cost deducted for this request (e.g. "0.005").
            X-RateLimit-Limit:
              schema: { type: integer }
              description: Request limit per minute
            X-RateLimit-Remaining:
              schema: { type: integer }
              description: Remaining requests in current window
            X-RateLimit-Reset:
              schema: { type: integer }
              description: Unix timestamp when limit resets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundamentalsResponse"
        "400":
          description: Malformed ticker or query parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "404":
          description: Ticker not present in the fundamentals panel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitExceeded"

  /decompose:
    post:
      summary: "(internal/legacy) Decompose a position into four additive bets with hedge ratios"
      description: >
        **Per Snapshot Architecture v3, prefer `POST /snapshot` with `type: "ticker"` for new clients.**
        This endpoint remains callable as an internal building block.

        Returns the simplified four-layer ERM3 exposure for a single ticker:
        `market`, `sector`, `subsector`, and `residual`. Each tradable layer
        (market / sector / subsector) maps to a hedge ETF from `ticker_metadata`;
        `residual` is stock-specific and not tradable. The response also includes
        a top-level `hedge` map of ETF → dollar ratio (negative of the layer
        hedge ratio by convention, so a positive stock HR yields a negative ETF
        notional: short the ETF to offset long stock exposure).


        Same billing profile as `GET /metrics/{ticker}` — this is a thin
        semantic wrapper that flattens the L3 metrics into an agent-friendly
        shape. For the full L1/L2/L3 snapshot (all six HR names), use
        `GET /metrics/{ticker}`.


        **Authentication:** Required (API Key or OAuth2)

        **Billing:** $0.001 per request

        **Rate Limit:** 120 requests/minute (default)
      operationId: decomposePosition
      tags: [Risk Metrics]
      x-pricing:
        capability_id: decompose-position
        tier: baseline
        model: per_request
        cost_usd: 0.001
        currency: USD
        billing_code: metrics_v3
      security:
        - BearerAuth: []
        - OAuth2ClientCredentials: [ticker-returns]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecomposeRequest"
            examples:
              nvda:
                summary: Decompose NVDA
                value: { ticker: "NVDA" }
              aapl:
                summary: Decompose AAPL
                value: { ticker: "AAPL" }
      responses:
        "200":
          description: Four-layer decomposition with hedge map.
          headers:
            X-API-Cost-USD:
              schema: { type: string }
              description: Cost deducted for this request (e.g. "0.001").
            X-Data-Freshness:
              schema: { type: string, format: date-time }
            X-RateLimit-Limit:
              schema: { type: integer }
            X-RateLimit-Remaining:
              schema: { type: integer }
            X-RateLimit-Reset:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecomposeResponse"
        "400":
          description: Malformed ticker or invalid JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "404":
          description: Symbol not found or no metrics row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitExceeded"

  /ticker-returns:
    get:
      summary: Daily returns time series with rolling hedge ratios (stocks and ETFs)
      description: >
        Returns a daily time series of gross returns (`returns_gross`) and, for stocks, V3 rolling
        hedge ratios and explained-risk fields per day: `l3_mkt_hr`, `l3_sec_hr`, `l3_sub_hr`,
        `l3_mkt_er`, `l3_sec_er`, `l3_sub_er`, `l3_res_er`. Up to 15 years per request.
        **ETFs are supported**: requests for ETF tickers (e.g. `SPY`, `XLK`) return
        `date`, `returns_gross`, and `price_close` sourced from `ds_etf.zarr`; L1/L2/L3 columns
        are `null` because ETFs are not factor-decomposed. The response includes
        `asset_type` ("stock" or "etf") so clients can branch cleanly.
        For the full L1/L2/L3 **snapshot** (all six HR names on the latest day), use
        `GET /metrics/{ticker}` (`metrics` object). Response does not include a top-level `_agent`
        block; billing is applied server-side. Cost: $0.005/call regardless of years pulled.
      operationId: getTickerReturns
      tags: [Risk Metrics]
      x-pricing:
        capability_id: ticker-returns
        tier: baseline
        model: per_request
        cost_usd: 0.005
        currency: USD
        billing_code: ticker_returns_v2
      parameters:
        - name: ticker
          in: query
          required: true
          schema:
            type: string
          example: NVDA
        - name: years
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 15
            default: 1
          description: Number of years of history to return.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Maximum number of rows to return.
        - name: nocache
          in: query
          required: false
          schema:
            type: boolean
          description: Bypass cache (incurs cost even if identical request was recently made).
        - $ref: "#/components/parameters/FormatQueryTabular"
      responses:
        "200":
          description: >
            Time series of daily returns, `price_close`, and V3 rolling HR/ER fields. JSON wraps rows
            in `data` with `symbol`, `ticker`, `meta`, `_metadata`. Parquet/CSV are a single table:
            one row per trading day; columns match `#/components/schemas/TickerReturnsDailyRow` in a
            stable key order (same field names as JSON object keys in each `data` element).
          headers:
            ETag:
              schema:
                type: string
              description: >
                Weak ETag (`W/"..."`). Clients may send `If-None-Match` to obtain `304 Not Modified`
                when the series is unchanged for this ticker, `years`, and format.
            X-Risk-Model-Version:
              schema: { type: string }
            X-Data-As-Of:
              schema: { type: string, format: date }
            X-Factor-Set-Id:
              schema: { type: string }
            X-Universe-Size:
              schema: { type: integer }
          content:
            application/vnd.apache.parquet:
              schema:
                type: string
                format: binary
              description: >
                Apache Parquet (one table). Row schema equals `#/components/schemas/TickerReturnsDailyRow`.
                No `_metadata` columns; use response headers for lineage.
            text/csv:
              schema:
                type: string
              description: >
                UTF-8 CSV: header row then one row per trading day; columns match the Parquet export.
              example: |
                date,returns_gross,price_close,l3_mkt_hr,l3_sec_hr,l3_sub_hr,l3_mkt_er,l3_sec_er,l3_sub_er,l3_res_er
                2025-03-20,0.0123,950.25,0.95,0.12,0.03,0.41,0.22,0.08,0.29
            application/json:
              schema:
                $ref: "#/components/schemas/TickerReturnsResponseV3"
        "401":
          description: Missing or invalid Bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientBalance"
        "404":
          description: Ticker not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitExceeded"

