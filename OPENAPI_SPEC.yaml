      security:
        - BearerAuth: []
        - OAuth2ClientCredentials: ["*"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint:
                  type: string
                  example: "ticker-returns"
                  description: Target endpoint (ticker-returns, batch-analyze, l3-decomposition, etc.)
