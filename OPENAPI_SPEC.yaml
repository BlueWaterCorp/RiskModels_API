  /webhooks/subscribe:
    get:
      summary: List webhook subscriptions
      description: Returns active webhook subscriptions for the authenticated user (secrets omitted).
      operationId: listWebhookSubscriptions
      tags: [Webhooks]
      responses:
        "200":
          description: Subscription list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        url: { type: string, format: uri }
                        events:
                          type: array
                          items: { type: string, enum: [batch.completed] }
                        active: { type: boolean }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error.
    post:
      summary: Create webhook subscription
      description: >
        Register an HTTPS URL for outbound events (e.g. `batch.completed`). The `secret` is returned
        once in the response; store it to verify `X-RiskModels-Signature` (HMAC-SHA256).
      operationId: createWebhookSubscription
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: Must use https://
                events:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [batch.completed]
                active:
                  type: boolean
                  default: true
                secret:
                  type: string
                  minLength: 24
                  maxLength: 512
                  description: Optional custom secret; otherwise server-generated.
      responses:
        "201":
          description: Created; `secret` included in body for verification.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      url: { type: string, format: uri }
                      events:
                        type: array
                        items: { type: string }
                      active: { type: boolean }
                      created_at: { type: string, format: date-time }
                      secret: { type: string }
        "400":
          description: Invalid URL or body.
        "401":
          description: Unauthorized.
        "500":
          description: Server error.
    delete:
      summary: Delete webhook subscription
      description: Remove a subscription by id (`?id=` query parameter).
      operationId: deleteWebhookSubscription
      tags: [Webhooks]
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "400":
          description: Missing id.
        "401":
          description: Unauthorized.
        "404":
          description: Subscription not found.

  /tickers:
    get:
      summary: Ticker universe search
      description: >
        List tickers in the universe or search by name/symbol. Billed per request ($0.001).
        Use the `mag7` flag to retrieve the MAG7 tickers. Use `include_metadata` for
        sector and ETF assignment per ticker.
      operationId: getTickers
      tags: [Utility]
      x-pricing:
        capability_id: ticker-search
        tier: baseline
        model: per_request
        cost_usd: 0.001
        currency: USD
        billing_code: ticker_search_v2
      security: []
      parameters:
        - name: array
          in: query
          required: false
          schema:
            type: string
            enum: [ticker, teo]
          description: "`ticker` returns all ticker symbols. `teo` returns valid trading dates."
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search string matched against ticker symbol or company name.
          example: NVDA
        - name: mag7
          in: query
          required: false
          schema:
            type: boolean
          description: Return only MAG7 tickers (AAPL, MSFT, NVDA, GOOGL, AMZN, META, TSLA).
        - name: include_metadata
          in: query
          required: false
          schema:
            type: boolean
          description: Include sector, sector ETF, and subsector ETF per ticker.
      responses:
        "200":
          description: Ticker list or search results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickers:
                    type: array
                    items:
                      type: string
                    example: ["AAPL", "MSFT", "NVDA"]
                  metadata:
                    type: object
                    nullable: true
                    additionalProperties:
                      type: object
                      properties:
                        name:
                          type: string
                        sector:
                          type: string
                        sector_etf:
                          type: string
                        subsector_etf:
                          type: string

  /estimate:
    post:
      summary: Estimate request cost
