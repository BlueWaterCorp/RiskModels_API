  /returns-decomposition:
    get:
      summary: Full returns decomposition (L1/L2/L3 + optional Lstar)
      description: |
        One-call daily return decomposition: gross return plus L1/L2/L3 factor,
        combined-factor, and residual return series from ds_erm3_returns zarr.
        Set `include_lstar=true` or `dispatch=lstar` to append Lstar level and
        Lstar-dispatched residual return per date (prefers materialized zarr
        lstar_rr/lstar_level when present; otherwise derives from marginal ERs).
      operationId: getReturnsDecomposition
      tags: [Risk Metrics]
      x-pricing:
        capability_id: returns-decomposition
        tier: premium
        model: per_request
        cost_usd: 0.02
        currency: USD
        billing_code: returns_decomposition_v1
      parameters:
        - name: ticker
          in: query
          required: true
          schema:
            type: string
          example: AAPL
        - name: market_factor_etf
          in: query
          schema:
            type: string
