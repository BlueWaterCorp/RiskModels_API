    LstarResponse:
      type: object
      description: >
        Per-(ticker, date) recommended hedge level (L1/L2/L3) with the chosen level's dispatched hedge
        ratios and total explained-return. Arrays are parallel by date index. Each L\* is a standalone
        hedge solution (not stacked layers) — `market_hr`/`sector_hr`/`subsector_hr` come from the
        chosen level's solver and are `null` where the chosen level doesn't use that ETF
        (sector_hr is null when L\*=L1; subsector_hr is null when L\*∈{L1,L2}). `axis` is always
        `industry` — the style axis was removed in v4 (style is a diagnostic block; see
        `POST /v4/decompose`).
      required:
        - ticker
        - axis
        - dates
        - lstar
        - market_hr
        - sector_hr
        - subsector_hr
        - total_er
        - residual_return
        - l2_sector_er
        - l3_subsector_er
        - threshold_used
        - market_factor_etf
        - universe
        - data_source
      properties:
        ticker:
          type: string
        axis:
          type: string
          enum: [industry]
          default: industry
          description: >
            Cascade axis — always `industry`. `style` was removed in v4 (style is served as a
            diagnostic block by `POST /v4/decompose`).
        dates:
          type: array
          items:
            type: string
            format: date
        lstar:
          type: array
          description: Recommended level per date. `null` where source ERs are unavailable.
          items:
            type: string
            enum: [L1, L2, L3]
            nullable: true
        market_hr:
          type: array
          items:
            type: number
            format: float
            nullable: true
        sector_hr:
          type: array
          description: Hedge ratio for the sector ETF. `null` when `lstar` = `L1`.
          items:
            type: number
            format: float
            nullable: true
        subsector_hr:
          type: array
          description: Hedge ratio for the subsector ETF. `null` when `lstar` ∈ {`L1`, `L2`}.
          items:
            type: number
            format: float
            nullable: true
        total_er:
          type: array
          description: >
            Sum of explained-return components at the chosen level (market + sector + subsector,
            omitting residual).
          items:
            type: number
            format: float
            nullable: true
        residual_return:
          type: array
          description: >
            Daily simple residual return at the chosen Lstar level (`l1_rr`, `l2_rr`, or `l3_rr`
            from returns decomposition). Parallel to `dates`; `null` when Lstar or source return
            is unavailable. Not a hedge ratio and not explained-risk variance (`l*_res_er`).
          items:
            type: number
            format: float
            nullable: true
        l2_sector_er:
          type: array
          description: >
            Marginal L2 (sector) ER input. Exposed for audit / threshold override.
          items:
            type: number
            format: float
            nullable: true
        l3_subsector_er:
          type: array
          description: >
            Marginal L3 (subsector) ER input. Exposed for audit / threshold override.
          items:
            type: number
            format: float
            nullable: true
        threshold_used:
          type: number
          format: float
          example: 0.01
          description: The marginal-ER threshold used to assign each date's level.
        market_factor_etf:
          type: string
        universe:
          type: string
        data_source:
          type: string
          example: zarr

