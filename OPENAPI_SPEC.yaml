                  type: object
                  description: Same params as the target endpoint
                  example: { ticker: "AAPL", years: 5 }
      responses:
        "200":
          description: Cost estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateResponse"
        "400":
          description: Unknown endpoint or invalid request
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitExceeded"

  /health:
    get:
      summary: Service health check
      description: >
        Returns current service status, version, capability availability (from recent billing_events),
        latest-session gross-return coverage (completeness signal), and optional macro_factors
        freshness for macro factor APIs (see macro_factors in the response). Free, no auth required.
      operationId: getHealth
      tags: [Utility]
      x-pricing:
        capability_id: health-status
        tier: baseline
        model: per_request
        cost_usd: 0
        currency: USD
        billing_code: health_check
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, down]
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                    example: 3.0.0-agent
                  services:
                    type: object
                    additionalProperties: true
                  capabilities:
                    type: object
                    additionalProperties: true
                  teo_coverage:
                    type: object
                    description: Coverage of returns_gross at the newest teo in security_history vs stock universe; sparse values suggest the latest session is still backfilling (10% threshold).
                    properties:
                      latest_teo:
                        type: string
                        format: date
                        nullable: true
                      universe_stock_count:
                        type: integer
                      non_null_returns_symbol_count:
                        type: integer
                      latest_teo_coverage_pct:
                        type: number
                        nullable: true
                        description: Percent 0–100 of universe with non-null gross return at latest_teo.
                      latest_session_returns_pending:
                        type: boolean
                      query_error:
                        type: string
                  macro_factors:
                    type: object
                    nullable: true
                    description: >
                      Daily macro factor return series freshness in Supabase macro_factors (POST /correlation,
                      GET /metrics/{ticker}/correlation, GET /macro-factors). Omitted or partial if the table is empty or the query fails.
                    properties:
                      status:
                        type: string
                        enum: [healthy, stale, unavailable]
                      latest_teos:
                        type: object
                        additionalProperties:
                          type: string
                          nullable: true
                        description: Most recent teo observed per factor_key (e.g. bitcoin, vix).
                      row_count_last_7d:
                        type: integer
                      newest_teo:
                        type: string
                        format: date
                        nullable: true
                      oldest_teo:
                        type: string
                        format: date
                        nullable: true
                      stale:
                        type: boolean
                        description: True when newest_teo is older than roughly three trading days.

  /status:
    get:
      summary: Aggregate service reliability metrics
      description: >
        Measured latency percentiles (p50/p95/p99) and a 5xx-only success rate over a window,
        aggregated across all capabilities from request telemetry, plus a per-capability breakdown.
        Numbers are observed from real traffic, not asserted SLAs. Metered 4xx
        (auth/payment/rate-limit) are excluded from both latency and success_rate. Free, no auth required.
      operationId: getStatus
      tags: [Utility]
      parameters:
        - name: window_hours
          in: query
          required: false
          description: Lookback window in hours (default 24, max 720).
          schema:
            type: integer
            default: 24
            minimum: 1
            maximum: 720
      x-pricing:
        capability_id: status-metrics
        tier: baseline
        model: per_request
        cost_usd: 0
        currency: USD
        billing_code: status_metrics
      security: []
      responses:
        "200":
          description: Reliability metrics for the window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  window_hours:
                    type: integer
                  measured_through:
                    type: string
                    format: date-time
                  sample_size:
                    type: integer
                    description: Service-relevant events in window (4xx excluded).
                  latency_ms:
                    type: object
                    nullable: true
                    description: Server-measured processing latency (excludes network); null if no traffic.
                    properties:
                      p50:
                        type: number
                      p95:
                        type: number
                      p99:
                        type: number
                      avg:
                        type: number
                  success_rate:
                    type: number
                    nullable: true
                    description: Fraction of service-relevant events that did not 5xx; null if no traffic.
                  by_capability:
                    type: object
                    additionalProperties: true
                  note:
                    type: string

  /feedback:
    post:
      summary: Submit feedback on an API result
      description: >
        Flag a specific result by its _agent.request_id with a rating / category / correction note.
        Trust-loop signal for offline data-quality and docs triage; no output changes at request time.
        Authenticated, free (no metering). Provide at least one of rating, category, or comment.
      operationId: postFeedback
      tags: [Utility]
      x-pricing:
        capability_id: feedback
        tier: baseline
        model: per_request
        cost_usd: 0
        currency: USD
        billing_code: feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_id:
                  type: string
                  description: The _agent.request_id / X-Request-ID of the call being rated. Nullable for general feedback.
                capability_id:
                  type: string
                rating:
                  type: string
                  enum: [up, down]
                category:
                  type: string
                  enum: [data_quality, incorrect_result, latency, docs, feature_request, other]
                comment:
                  type: string
                  maxLength: 4000
      responses:
        "201":
          description: Feedback recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  feedback_id:
                    type: string
                  message:
                    type: string
        "400":
          description: Invalid or empty feedback (no rating/category/comment, bad enum, or comment too long).
        "401":
          description: Missing or invalid API key.
        "503":
          description: Feedback store temporarily unavailable (retry).

