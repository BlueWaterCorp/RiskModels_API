# =============================================================================
# MCP data drift
# =============================================================================
#
# Two separate questions, two jobs:
#
# 1. generated-artifacts (every PR / push to main)
#    Are the committed generated files current? Regenerates
#    mcp/data/openapi.json (from OPENAPI_SPEC.yaml) and mcp/data/capabilities.json
#    (from lib/agent/capabilities.ts) and fails if they differ from what is
#    committed. This is the mistake a PR author can make and fix, so a failure
#    here always means "run the generators and commit".
#
# 2. mirror (after the sync workflow, daily, or on demand)
#    Does the Risk_Models copy match RiskModels_API main? The mirror is only
#    updated after merge (sync-mcp-to-risk-models.yml), so comparing it to a PR
#    branch fails on every spec change by construction. Comparing it to main
#    catches the real problems: a broken sync, or a hand edit in Risk_Models.
#
# REQUIRED SECRET (mirror job only): REPO_ACCESS_TOKEN — read on BlueWaterCorp/Risk_Models.
#
name: MCP Data Drift

on:
  pull_request:
    paths:
      - "OPENAPI_SPEC.yaml"
      - "mcp/data/**"
      - "lib/agent/capabilities.ts"
      - "scripts/yaml-to-json.js"
      - "scripts/generate-mcp-capabilities.mjs"
      - ".github/workflows/drift-detection.yml"
  push:
    branches: [main]
    paths:
      - "OPENAPI_SPEC.yaml"
      - "mcp/data/**"
      - "lib/agent/capabilities.ts"
      - "scripts/yaml-to-json.js"
      - "scripts/generate-mcp-capabilities.mjs"
  workflow_run:
    workflows: ["Sync MCP data to Risk_Models"]
    types: [completed]
  schedule:
    # Daily 07:00 UTC — catches hand edits in Risk_Models between syncs.
    - cron: "0 7 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generated-artifacts:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Regenerate MCP artifacts
        run: |
          npm run build:openapi
          npm run build:capabilities

      - name: Fail if committed artifacts are stale
        run: |
          if git diff --quiet -- mcp/data; then
            echo "✅ mcp/data/openapi.json and capabilities.json match their sources"
            exit 0
          fi
          echo "❌ Generated MCP files are out of date with their sources:"
          git diff --stat -- mcp/data
          echo ""
          git diff -- mcp/data | head -120
          echo ""
          echo "Fix: npm run build:openapi && npm run build:capabilities, then commit mcp/data/."
          exit 1

  mirror:
    # Only main is compared with the mirror. Skip if the sync run itself failed
    # (that failure is already red) and skip fork contexts without the secret.
    if: >-
      github.repository == 'BlueWaterCorp/RiskModels_API' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout RiskModels_API main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout Risk_Models (private)
        uses: actions/checkout@v6
        with:
          repository: BlueWaterCorp/Risk_Models
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: risk_models
          fetch-depth: 1

      - name: Compare mirror with main
        run: |
          SRC="mcp/data"
          DST="risk_models/riskmodels_net/mcp-server/data"
          DRIFT=0
          for f in schema-paths.json openapi.json capabilities.json; do
            if [ ! -f "$SRC/$f" ]; then continue; fi
            if [ ! -f "$DST/$f" ]; then
              echo "❌ Missing in Risk_Models: $f"; DRIFT=1; continue
            fi
            if ! diff -q "$SRC/$f" "$DST/$f" > /dev/null; then
              echo "❌ Differs from main: $f"
              diff "$SRC/$f" "$DST/$f" | head -60 || true
              DRIFT=1
            fi
          done
          if [ -d "$SRC/schemas" ]; then
            if ! diff -rq "$SRC/schemas" "$DST/schemas"; then
              echo "❌ schemas/ differs from main"
              DRIFT=1
            fi
          fi
          if [ "$DRIFT" -eq 0 ]; then
            echo "✅ Risk_Models mirror matches RiskModels_API main"
            exit 0
          fi
          echo ""
          echo "The mirror does not match main. Either the sync workflow did not push"
          echo "(check 'Sync MCP data to Risk_Models'), or the Risk_Models copy was edited"
          echo "by hand. Re-run the sync with workflow_dispatch; edit sources here, not there."
          exit 1
