# Full coverage: set repo secret TEST_API_SECRET (live API key) in GitHub → Settings → Secrets.
# If empty, the "Authenticated endpoints" step is skipped. See DEPLOYMENT.md → GitHub Actions.

name: Production Smoke Test

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  schedule:
    # Daily at 7 AM UTC, after overnight data refresh
    - cron: '0 7 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: riskmodels.app Health
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # Job-level env so `if: env.TEST_API_SECRET != ''` works (step-level env is not visible in that step's `if`).
    # See: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsif
    env:
      TEST_API_SECRET: ${{ secrets.TEST_API_SECRET }}
      # Optional: a Supabase personal access token (sbp_…) with read access to the
      # project's auth config. If empty, the "Login lands on riskmodels.app" check
      # is skipped. Add via GitHub → Settings → Secrets → SUPABASE_MGMT_PAT.
      SUPABASE_MGMT_PAT: ${{ secrets.SUPABASE_MGMT_PAT }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Build CLI
        working-directory: cli
        run: npm ci && npm run build

      - name: Health check (CLI — retries slow / 5xx deploys)
        working-directory: cli
        run: node dist/index.js health

      - name: OpenAPI spec accessible
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://riskmodels.app/openapi.json)
          if [ "$STATUS" != "200" ]; then
            echo "❌ /openapi.json returned $STATUS"
            exit 1
          fi
          echo "✅ /openapi.json → $STATUS"

      - name: Unauthenticated endpoints return 401
        run: |
          # /api/tickers is intentionally public (landing-page search) — excluded here
          for ENDPOINT in \
            "/api/estimate" \
            "/api/balance" \
            "/api/l3-decomposition" \
            "/api/metrics/AAPL"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://riskmodels.app${ENDPOINT}")
            if [ "$STATUS" != "401" ] && [ "$STATUS" != "400" ] && [ "$STATUS" != "405" ]; then
              echo "❌ ${ENDPOINT} should require auth, got $STATUS"
              exit 1
            fi
            echo "✅ ${ENDPOINT} → $STATUS (auth enforced)"
          done

      - name: MCP connector advertises OAuth (keyless 401 → WWW-Authenticate)
        run: |
          # Regression guard for MCP_ADVERTISE_OAUTH. When unset, keyless /api/mcp/sse
          # returns a bare 401 with no challenge and Claude's web connector hangs at
          # "Connect" (reported by Garrett, 2026-06-23). Bearer-key clients never hit
          # this branch, so this is the only automated signal that the connector is wired.
          HDRS=$(curl -s -D - -o /dev/null -X POST https://riskmodels.app/api/mcp/sse \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"initialize","id":1}')
          if ! printf '%s' "$HDRS" | grep -qi '^www-authenticate:.*oauth-protected-resource'; then
            echo "❌ Keyless /api/mcp/sse is missing the WWW-Authenticate OAuth challenge — the connector will hang."
            echo "   (Check MCP_ADVERTISE_OAUTH=true in Vercel prod env.)"
            printf '%s' "$HDRS" | head -20
            exit 1
          fi
          echo "✅ /api/mcp/sse advertises the OAuth challenge"

      - name: OAuth discovery chain reachable
        run: |
          for P in "/.well-known/oauth-protected-resource" "/.well-known/oauth-authorization-server"; do
            S=$(curl -s -o /dev/null -w "%{http_code}" "https://riskmodels.app${P}")
            if [ "$S" != "200" ]; then echo "❌ ${P} → $S"; exit 1; fi
            echo "✅ ${P} → 200"
          done

      - name: Login lands on riskmodels.app (Supabase auth config)
        if: ${{ env.SUPABASE_MGMT_PAT != '' }}
        run: |
          # Catches the .net/.app regression (2026-06-23): if site_url is the dead
          # .net stub, or the allowlist lacks the riskmodels.app/** wildcard, magic-link
          # and Google sign-in fall back to a domain with no /auth/callback and login dies.
          REF=plurbatnjhpullghyhol
          CFG=$(curl -s "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_MGMT_PAT")
          printf '%s' "$CFG" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if set(d) == {'message'}:
              raise SystemExit('❌ management API error: ' + str(d))
          su = d.get('site_url', '')
          al = d.get('uri_allow_list', '')
          assert su.startswith('https://riskmodels.app'), f'site_url is {su!r} — must be riskmodels.app, not the .net stub'
          assert 'https://riskmodels.app/**' in al, 'allowlist missing https://riskmodels.app/** — the ?next= callback will fall back to site_url'
          print('✅ Supabase site_url + allowlist point at riskmodels.app')
          "

      # Smoke runs on push immediately; Vercel often has not finished deploying the same commit yet.
      - name: Wait for Vercel deploy (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Waiting 90s so riskmodels.app can serve the commit that triggered this workflow..."
          sleep 90

      - name: Authenticated endpoints (with TEST_API_SECRET)
        if: ${{ env.TEST_API_SECRET != '' }}
        run: |
          # Tickers search
          RESPONSE=$(curl -s -H "Authorization: Bearer $TEST_API_SECRET" \
            "https://riskmodels.app/api/tickers?search=AAPL")
          if ! echo "$RESPONSE" | grep -qi "AAPL"; then
            echo "❌ /api/tickers did not return AAPL"
            echo "$RESPONSE" | head -5
            exit 1
          fi
          echo "✅ /api/tickers search → AAPL found"

          # Balance — must be 200 with can_make_requests
          BAL=$(curl -s -H "Authorization: Bearer $TEST_API_SECRET" \
            "https://riskmodels.app/api/balance")
          if ! echo "$BAL" | grep -q '"can_make_requests":true'; then
            echo "❌ /api/balance did not return can_make_requests:true"
            echo "$BAL" | head -3
            exit 1
          fi
          echo "✅ /api/balance → can_make_requests:true"

          # Metrics — V3 JSON shape (ticker + metrics object with L3 keys)
          MET=$(curl -s -H "Authorization: Bearer $TEST_API_SECRET" \
            "https://riskmodels.app/api/metrics/AAPL")
          echo "$MET" | python3 -c "import sys,json;d=json.load(sys.stdin);assert d.get('ticker'),d;assert isinstance(d.get('metrics'),dict),d;m=d['metrics'];assert any(k in m for k in ('l3_mkt_hr','l3_mkt_er','l3_sec_hr','l3_sub_hr','l3_res_er')),list(m.keys())"
          echo "✅ /api/metrics/AAPL → ticker + metrics (V3 keys)"

          # Ticker returns — data-plane check. Retries up to 5x because the zarr/security_history
          # slice has been observed flapping between full and empty on the same ticker within seconds
          # (see docs/CACHE_EMPTY_PAYLOAD_FIXES.md → "Operational follow-up"). Any non-empty attempt
          # passes; if all 5 are empty, we report every attempt's status + size + latency so the
          # failure log distinguishes a genuine outage from a transient.
          echo "--- /api/ticker-returns data-plane check (NVDA, up to 5 attempts)"
          TR_OK=0
          TR_LOG=""
          for i in 1 2 3 4 5; do
            METRICS=$(curl -sS -o /tmp/tr_resp.json \
              -w "http=%{http_code} bytes=%{size_download} t=%{time_total}" \
              -H "Authorization: Bearer $TEST_API_SECRET" \
              "https://riskmodels.app/api/ticker-returns?ticker=NVDA&years=1&format=json")
            LEN=$(python3 -c "import json;d=json.load(open('/tmp/tr_resp.json'));print(len(d.get('data') or []))" 2>/dev/null || echo "0")
            TR_LOG="${TR_LOG}  attempt ${i}: ${METRICS} data_len=${LEN}"$'\n'
            if [ "$LEN" -gt 0 ]; then
              TR_OK=1
              echo "✅ /api/ticker-returns NVDA → data_len=${LEN} on attempt ${i}"
              break
            fi
            sleep 2
          done
          if [ "$TR_OK" -ne 1 ]; then
            echo "❌ /api/ticker-returns NVDA returned empty data on all 5 attempts:"
            echo "$TR_LOG"
            exit 1
          fi

          # Free-tier status (any non-5xx is acceptable for a paid account)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TEST_API_SECRET" \
            "https://riskmodels.app/api/auth/free-tier-status")
          if echo "$STATUS" | grep -q "^5"; then
            echo "❌ /api/auth/free-tier-status returned $STATUS"
            exit 1
          fi
          echo "✅ /api/auth/free-tier-status → $STATUS"

      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 riskmodels.app smoke test failed',
              body: [
                '## Production Smoke Test Failure',
                '',
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Time:** ${new Date().toISOString()}`,
                '',
                'Check the workflow logs above for the failing endpoint.',
              ].join('\n'),
            });
