# Publish mcp/server.json to the official MCP Registry
# (io.github.BlueWaterCorp/riskmodels).
#
# Authenticates with GitHub OIDC as this repository, so no personal login,
# PAT or third-party GitHub App install on the org is needed. npm publishing
# of @riskmodels/mcp stays manual (2FA); bump mcp/server.json after the npm
# release and merge — this workflow then lists the new version.
name: Publish MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mcp/server.json

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC for mcp-publisher
      contents: read
    defaults:
      run:
        working-directory: mcp
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v6

      - name: Check the npm version exists
        run: |
          v=$(jq -r '.packages[0].version' server.json)
          npm view "@riskmodels/mcp@${v}" version

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
