name: Keep PR branches current

# When main moves, every open PR against it goes behind. Nothing notices until
# someone opens the PR to merge it, and by then a sibling PR has often landed
# in the same append-only file (CHANGELOG.md, OPENAPI_SPEC.yaml) and turned
# "behind" into "conflicting". This closes the ordinary case: on every push to
# main, ask GitHub to merge main into each open PR branch.
#
# What it deliberately does NOT do:
#
#   * Fail on conflict. A real content conflict needs a person; the job records
#     which PRs need attention in its summary and exits green. A red X here
#     would mean "someone else's PR conflicts", which is not this workflow's
#     failure and would train people to ignore it.
#   * Touch forks. The token cannot push to a fork's branch, and trying just
#     produces noise.
#   * Merge anything. Who merges, and when, is unchanged.
#
# ── Why this requires PR_UPDATE_TOKEN, and refuses to run without it ────────
# A branch updated with the default GITHUB_TOKEN is committed as
# `github-actions[bot]`. The documented consequence is that workflows are not
# re-triggered. The observed consequence on Risk_Models, 2026-08-04, was
# worse: the required checks landed in "4 workflows awaiting approval", so the
# PR looked stuck and needed a human click — on a repo whose protection is
# `strict`, meaning the branch must be current to merge at all. A workflow
# built to remove friction had added a manual step to every PR it touched.
#
# So the fallback is gone. Without `PR_UPDATE_TOKEN` this job does nothing and
# says so. A stale branch someone updates by hand is a smaller problem than an
# approval-gated one nobody understands — and a silently expired token now
# means "no sweep" rather than the return of a symptom whose cause took a
# screenshot to find.
#
# The secret is a fine-grained PAT with Contents: read/write and Pull
# requests: read/write, scoped to this repository.

on:
  push:
    branches: [main]
  # A push-only trigger has a hole, found the day this shipped: a PR opened
  # *after* the last push to main is branched from an older main and never
  # gets swept, because no push follows it. It sits behind until main happens
  # to move again — which on a quiet afternoon is hours. The hourly sweep
  # closes that; it is a no-op when nothing is behind.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Two pushes to main in quick succession would otherwise race on the same
  # PR branches. Let the later one win; it has the newer base.
  group: keep-pr-branches-current
  cancel-in-progress: true

jobs:
  update:
    name: Update open PR branches
    runs-on: ubuntu-latest
    steps:
      - name: Require PR_UPDATE_TOKEN
        id: token
        env:
          HAVE_TOKEN: ${{ secrets.PR_UPDATE_TOKEN != '' }}
        run: |
          if [ "$HAVE_TOKEN" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Keep PR branches current — did not run"
            echo ""
            echo "\`PR_UPDATE_TOKEN\` is not set on this repository, so no branches were touched."
            echo ""
            echo "Falling back to \`GITHUB_TOKEN\` would author the update as"
            echo "\`github-actions[bot]\`, which puts the required checks into"
            echo "*awaiting approval* and leaves the PR needing a manual click — more"
            echo "friction than the staleness this job exists to remove."
            echo ""
            echo "Add a fine-grained PAT (Contents + Pull requests, read/write) as"
            echo "\`PR_UPDATE_TOKEN\` to enable it."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::PR_UPDATE_TOKEN not set — sweep skipped by design."

      - name: Update every open PR based on main
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.PR_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          # `--json` keeps this robust against gh's human-readable output
          # changing. isCrossRepository is the fork test.
          prs=$(gh pr list --state open --base main --limit 100 \
                  --json number,headRefName,isCrossRepository,mergeStateStatus)

          total=$(jq 'length' <<<"$prs")
          echo "Open PRs against main: $total"

          updated=(); conflicted=(); skipped=(); already=()

          while IFS=$'\t' read -r num head fork state; do
            [ -z "${num:-}" ] && continue

            if [ "$fork" = "true" ]; then
              skipped+=("#$num ($head — fork)")
              continue
            fi

            # DIRTY is a content conflict: update-branch cannot fix it, and
            # calling it only to read the error back is a wasted round trip.
            if [ "$state" = "DIRTY" ]; then
              conflicted+=("#$num ($head)")
              continue
            fi

            # BEHIND is the case this workflow exists for. UNKNOWN means
            # GitHub has not finished computing mergeability, so try. Every
            # other state (CLEAN, UNSTABLE, BLOCKED, HAS_HOOKS, DRAFT) is not
            # behind, and updating would churn CI for nothing.
            if [ "$state" != "BEHIND" ] && [ "$state" != "UNKNOWN" ]; then
              already+=("#$num")
              continue
            fi

            if out=$(gh pr update-branch "$num" 2>&1); then
              updated+=("#$num ($head)")
            elif grep -qi 'conflict' <<<"$out"; then
              conflicted+=("#$num ($head)")
            elif grep -qi 'not behind\|up to date\|up-to-date' <<<"$out"; then
              already+=("#$num")
            else
              # Anything unexpected is reported rather than swallowed, but it
              # still does not fail the job — see the header.
              skipped+=("#$num ($head — $(head -c 120 <<<"$out"))")
            fi
          done < <(jq -r '.[] | [.number, .headRefName, .isCrossRepository, .mergeStateStatus] | @tsv' <<<"$prs")

          {
            echo "## Keep PR branches current"
            echo ""
            echo "Updated branches re-run their checks — the update is authored by"
            echo "the \`PR_UPDATE_TOKEN\` identity, not by \`github-actions[bot]\`."
            echo ""
            printf '| Outcome | PRs |\n|---|---|\n'
            printf '| Updated | %s |\n'      "$( [ ${#updated[@]} -gt 0 ]    && echo "${updated[*]}"    || echo '—' )"
            printf '| Already current | %s |\n' "$( [ ${#already[@]} -gt 0 ] && echo "${already[*]}"    || echo '—' )"
            printf '| **Conflicting — needs a person** | %s |\n' "$( [ ${#conflicted[@]} -gt 0 ] && echo "${conflicted[*]}" || echo '—' )"
            printf '| Skipped | %s |\n'      "$( [ ${#skipped[@]} -gt 0 ]    && echo "${skipped[*]}"    || echo '—' )"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#conflicted[@]} -gt 0 ]; then
            echo "::warning::Conflicting PRs need manual resolution: ${conflicted[*]}"
          fi
